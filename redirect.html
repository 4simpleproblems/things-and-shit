<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE IDENTITY ROUTER</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            background: #080808;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-left-color: #0070f3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px auto;
        }
        h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            color: #888888;
        }
        p {
            font-size: 0.85rem;
            color: #cccccc;
            line-height: 1.6;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>SECURE ACCESS ROUTER</h1>
        <p id="status-message">Routing secure authentication request...</p>
    </div>
    <script>
        (async function() {
            const url = 'https://epnjfsfveqbvoimpstbd.supabase.co';
            const key = 'sb_publishable_12ymAaNfKTNDknIvcDVdEQ_l7P8jfdr';

            function isTrusted(urlStr) {
                try {
                    const url = new URL(urlStr);
                    const host = url.hostname;
                    return host === 'localhost' ||
                           host === '127.0.0.1' ||
                           host.endsWith('geopolitics-game.org') ||
                           host.endsWith('things-and-shit.org');
                } catch (e) {
                    return false;
                }
            }

            const params = new URLSearchParams(window.location.search);
            const action = params.get('action');
            const fromUrl = params.get('from');

            if (fromUrl && isTrusted(fromUrl)) {
                localStorage.setItem('auth_redirect_from', fromUrl);
            }

            const savedFrom = localStorage.getItem('auth_redirect_from');

            if (action === 'google') {
                if (window.supabase) {
                    const client = window.supabase.createClient(url, key);
                    await client.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: 'https://things-and-shit.org/redirect.html' }
                    });
                }
            } else if (action === 'email') {
                const email = params.get('email');
                const statusDiv = document.getElementById('status-message');
                if (email && window.supabase) {
                    const client = window.supabase.createClient(url, key);
                    const { error } = await client.auth.signInWithOtp({
                        email,
                        options: { emailRedirectTo: 'https://things-and-shit.org/redirect.html' }
                    });
                    if (error) {
                        statusDiv.innerText = 'Error: ' + error.message;
                    } else {
                        statusDiv.innerHTML = `Magic link sent to <strong>${email}</strong>.<br><br>Check your inbox and click the link to complete authentication.`;
                    }
                } else {
                    statusDiv.innerText = 'Email address is missing.';
                }
            } else {
                const hash = window.location.hash;
                if (savedFrom && isTrusted(savedFrom)) {
                    localStorage.removeItem('auth_redirect_from');
                    window.location.replace(savedFrom.split('#')[0] + hash);
                } else {
                    window.location.replace('/index.html' + hash);
                }
            }
        })();
    </script>
</body>
</html>
