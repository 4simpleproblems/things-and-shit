<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAS Studio | Dynamic Video Base</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --bg: #FFB703; /* Yellow from icon_maker */
      --panel-bg: #ffffff;
      --dark: #1a1a1a;
      --border: 5px solid var(--dark);
      --shadow: 8px 8px 0px #e0e0e0;
      --accent: #70D6FF;
      --danger: #FF0054;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: var(--bg); 
      font-family: 'Nunito', sans-serif; 
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP LEFT INFO */
    .studio-header {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1000;
      pointer-events: none;
    }
    .studio-header h1 {
      font-family: 'Alfa Slab One', serif;
      font-size: 32px;
      color: var(--dark);
      line-height: 1;
      text-transform: lowercase;
    }
    .studio-header p {
      font-weight: 900;
      color: var(--dark);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      margin-top: 5px;
    }

    /* MAIN CONTAINER */
    .app-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
      width: 100vw;
      padding: 100px 40px 40px;
      gap: 40px;
    }

    /* SIDEBAR CONTROLS */
    .controls {
      background: var(--panel-bg);
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .control-group label {
      display: block;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      color: #aaa;
    }

    .btn-action {
      width: 100%;
      padding: 15px;
      border: 4px solid var(--dark);
      border-radius: 18px;
      font-family: 'Alfa Slab One', serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 4px 4px 0px var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-transform: uppercase;
    }
    .btn-action:hover { transform: translateY(-3px); box-shadow: 6px 6px 0px var(--dark); }
    .btn-action:active { transform: translateY(0); box-shadow: 2px 2px 0px var(--dark); }

    .btn-blue { background: var(--accent); }
    .btn-pink { background: var(--danger); color: #fff; }
    .btn-white { background: #fff; }
    .btn-mini { padding: 8px; font-size: 10px; border-radius: 10px; }

    /* SLIDE LIST */
    .slide-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slide-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #f9f9f9;
      border: 4px solid var(--dark);
      border-radius: 15px;
      padding: 12px;
      position: relative;
      transition: 0.2s;
    }
    .slide-item.active { border-color: var(--accent); background: #e8f8ff; }
    
    .slide-index {
      width: 30px; height: 30px; background: var(--dark); color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: 'Alfa Slab One', serif; font-size: 12px;
    }

    .slide-type-icon { font-size: 20px; color: var(--dark); width: 30px; text-align: center; }

    .slide-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .action-icon { cursor: pointer; transition: 0.1s; font-size: 14px; }
    .action-icon:hover { transform: scale(1.2); color: var(--danger); }
    .action-icon.move:hover { color: var(--accent); }

    /* PREVIEW AREA */
    .preview {
      background: #111;
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* MODAL FOR EDITING SLIDE */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 3000; display: none; align-items: center; justify-content: center;
      padding: 40px; backdrop-filter: blur(5px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff; border: var(--border); border-radius: 30px;
      width: 100%; max-width: 500px; padding: 40px; box-shadow: 20px 20px 0px var(--dark);
    }
    .input-box {
      width: 100%; border: 4px solid var(--dark); border-radius: 15px; padding: 15px;
      font-family: 'Alfa Slab One', serif; font-size: 18px; background: #f9f9f9; outline: none; margin-bottom: 20px;
    }
    .select-box {
      width: 100%; border: 4px solid var(--dark); border-radius: 15px; padding: 12px;
      font-family: 'Nunito', sans-serif; font-weight: 900; background: #f9f9f9; margin-bottom: 20px;
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--dark); color: #fff; padding: 15px 30px; border-radius: 15px;
      font-family: 'Alfa Slab One', serif; font-size: 14px; border: 4px solid var(--accent);
      z-index: 4000; transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .toast.active { transform: translateX(-50%) translateY(0); }

    input[type="file"] { display: none; }

  </style>
</head>
<body>

  <div class="studio-header">
    <h1>tas studio<span>.</span></h1>
    <p>dynamic video tool</p>
  </div>

  <div class="app-grid">
    
    <div class="controls">
      
      <div class="control-group">
        <label>Slide Direction</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button class="btn-action btn-white btn-mini" id="dir-up" onclick="studio.setDirection('up')">UP</button>
          <button class="btn-action btn-white btn-mini" id="dir-down" onclick="studio.setDirection('down')">DOWN</button>
          <button class="btn-action btn-white btn-mini" id="dir-left" onclick="studio.setDirection('left')">LEFT</button>
          <button class="btn-action btn-white btn-mini" id="dir-right" onclick="studio.setDirection('right')">RIGHT</button>
        </div>
      </div>

      <div class="control-group" style="flex:1; display:flex; flex-direction:column;">
        <label>Sequence</label>
        <div class="slide-list" id="slideList" style="flex:1; overflow-y:auto; padding-right:5px;">
          <div style="text-align:center; color:#aaa; font-size:11px; font-weight:900; padding:20px;">NO SLIDES</div>
        </div>
      </div>

      <div class="control-group">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <button class="btn-action btn-blue" onclick="studio.addNewSlide('text')">
            <i class="fa-solid fa-plus"></i> TEXT
          </button>
          <button class="btn-action btn-blue" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-plus"></i> IMG
          </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="studio.handleUpload(event)">
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn-action btn-pink" onclick="studio.startSequence()">
          <i class="fa-solid fa-play"></i> PLAY VIDEO
        </button>
        <button class="btn-action btn-white" onclick="studio.reset()">
          <i class="fa-solid fa-rotate-left"></i> RESET
        </button>
      </div>
    </div>

    <div class="preview">
      <canvas id="previewCanvas"></canvas>
    </div>

  </div>

  <!-- SLIDE EDITOR MODAL -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2 style="font-family:'Alfa Slab One'; margin-bottom:20px; text-transform:uppercase;">Edit Slide</h2>
      
      <div id="textFields">
        <label style="font-weight:900; font-size:11px; text-transform:uppercase; color:#aaa;">Main Title / Content</label>
        <textarea id="modalMainText" class="input-box" rows="2"></textarea>
        
        <div id="introOnlyFields" style="display:none;">
          <label style="font-weight:900; font-size:11px; text-transform:uppercase; color:#aaa;">Description (Shows above Title)</label>
          <textarea id="modalDescText" class="input-box" rows="2"></textarea>
          
          <label style="font-weight:900; font-size:11px; text-transform:uppercase; color:#aaa;">Corner Alignment</label>
          <select id="modalAlign" class="select-box">
            <option value="tl">Top Left</option>
            <option value="tr">Top Right</option>
            <option value="bl">Bottom Left</option>
            <option value="br">Bottom Right</option>
          </select>
        </div>

        <label style="font-weight:900; font-size:11px; text-transform:uppercase; color:#aaa;">Layout Style</label>
        <select id="modalLayout" class="select-box" onchange="studio.toggleModalFields()">
          <option value="center">Center</option>
          <option value="intro-alignable">Intro, Alignable</option>
        </select>
      </div>

      <div style="display:flex; gap:15px;">
        <button class="btn-action btn-blue" onclick="studio.saveEdit()">Save Changes</button>
        <button class="btn-action btn-white" onclick="studio.closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="studioToast">READY</div>

  <script>
    class TASVideoStudio {
      constructor() {
        this.canvas = document.getElementById('previewCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.res = { w: 1920, h: 1080 };
        
        this.slides = []; 
        this.direction = 'left';
        this.isAnimating = false;
        this.playIndex = -1;
        this.t = 0;
        
        this.editingIndex = -1;

        this.init();
      }

      init() {
        this.canvas.width = this.res.w;
        this.canvas.height = this.res.h;
        this.setDirection('left');
        this.renderLoop();
      }

      setDirection(dir) {
        this.direction = dir;
        document.querySelectorAll('.btn-mini').forEach(b => b.classList.remove('active'));
        document.getElementById(`dir-${dir}`).classList.add('active');
      }

      addNewSlide(type) {
        const slide = {
          type: type,
          layout: 'center',
          alignment: 'tl',
          mainText: 'NEW CONTENT',
          descText: 'SUBTITLE HERE',
          img: null
        };
        this.slides.push(slide);
        this.updateSlideList();
        this.openEdit(this.slides.length - 1);
      }

      handleUpload(e) {
        const files = Array.from(e.target.files);
        let loaded = 0;
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              this.slides.push({
                type: 'image',
                img: img,
                layout: 'center'
              });
              loaded++;
              if (loaded === files.length) {
                this.updateSlideList();
                this.showToast(`ADDED ${files.length} IMAGES`);
              }
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      updateSlideList() {
        const list = document.getElementById('slideList');
        if (this.slides.length === 0) {
          list.innerHTML = `<div style="text-align:center; color:#aaa; font-size:11px; font-weight:900; padding:20px;">NO SLIDES</div>`;
          return;
        }
        list.innerHTML = this.slides.map((s, i) => `
          <div class="slide-item ${this.playIndex === i ? 'active' : ''}">
            <div class="slide-index">${i + 1}</div>
            <div class="slide-type-icon">
              <i class="fa-solid ${s.type === 'image' ? 'fa-image' : 'fa-font'}"></i>
            </div>
            <div class="slide-controls">
              <i class="fa-solid fa-pen-to-square action-icon move" onclick="studio.openEdit(${i})"></i>
              <i class="fa-solid fa-chevron-up action-icon move" onclick="studio.moveSlide(${i}, -1)"></i>
              <i class="fa-solid fa-chevron-down action-icon move" onclick="studio.moveSlide(${i}, 1)"></i>
              <i class="fa-solid fa-trash-can action-icon" onclick="studio.removeSlide(${i})"></i>
            </div>
          </div>
        `).join('');
      }

      moveSlide(index, delta) {
        const newIndex = index + delta;
        if (newIndex < 0 || newIndex >= this.slides.length) return;
        [this.slides[index], this.slides[newIndex]] = [this.slides[newIndex], this.slides[index]];
        this.updateSlideList();
      }

      removeSlide(index) {
        this.slides.splice(index, 1);
        this.updateSlideList();
      }

      openEdit(index) {
        const s = this.slides[index];
        this.editingIndex = index;
        document.getElementById('editModal').classList.add('active');
        
        if (s.type === 'text') {
          document.getElementById('textFields').style.display = 'block';
          document.getElementById('modalMainText').value = s.mainText;
          document.getElementById('modalDescText').value = s.descText;
          document.getElementById('modalLayout').value = s.layout;
          document.getElementById('modalAlign').value = s.alignment;
          this.toggleModalFields();
        } else {
          document.getElementById('textFields').style.display = 'none';
        }
      }

      toggleModalFields() {
        const layout = document.getElementById('modalLayout').value;
        document.getElementById('introOnlyFields').style.display = layout === 'intro-alignable' ? 'block' : 'none';
      }

      closeModal() {
        document.getElementById('editModal').classList.remove('active');
      }

      saveEdit() {
        const s = this.slides[this.editingIndex];
        if (s.type === 'text') {
          s.mainText = document.getElementById('modalMainText').value;
          s.descText = document.getElementById('modalDescText').value;
          s.layout = document.getElementById('modalLayout').value;
          s.alignment = document.getElementById('modalAlign').value;
        }
        this.updateSlideList();
        this.closeModal();
      }

      startSequence() {
        if (this.slides.length === 0) return this.showToast("ADD SLIDES FIRST");
        this.isAnimating = true;
        this.playIndex = 0;
        this.t = 0;
        this.updateSlideList();
      }

      reset() {
        this.isAnimating = false;
        this.playIndex = -1;
        this.t = 0;
        this.updateSlideList();
      }

      showToast(msg) {
        const t = document.getElementById('studioToast');
        t.innerText = msg.toUpperCase();
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 2500);
      }

      ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      getDynamicFontSize(text, base, minSize = 40) {
        const len = text.length;
        if (len < 10) return base;
        return Math.max(minSize, base * (10 / len));
      }

      drawTextContent(slide, ox, oy) {
        this.ctx.save();
        this.ctx.translate(ox, oy);
        this.ctx.fillStyle = '#1a1a1a';
        this.ctx.textAlign = 'center';

        if (slide.layout === 'center') {
          const fontSize = this.getDynamicFontSize(slide.mainText, 240, 60);
          this.ctx.font = `900 ${fontSize}px 'Alfa Slab One'`;
          const lines = slide.mainText.split('\n');
          lines.forEach((line, i) => {
            const y = (this.res.h / 2) + (i - (lines.length - 1) / 2) * (fontSize * 0.9);
            this.ctx.fillText(line, this.res.w / 2, y);
          });
        } else {
          // Intro, Alignable
          const titleSize = this.getDynamicFontSize(slide.mainText, 120, 40);
          const descSize = titleSize * 0.5;
          const padding = 80;
          
          let tx, ty;
          const al = slide.alignment;
          if (al === 'tl') { tx = padding; ty = padding + descSize; this.ctx.textAlign = 'left'; }
          if (al === 'tr') { tx = this.res.w - padding; ty = padding + descSize; this.ctx.textAlign = 'right'; }
          if (al === 'bl') { tx = padding; ty = this.res.h - padding - titleSize; this.ctx.textAlign = 'left'; }
          if (al === 'br') { tx = this.res.w - padding; ty = this.res.h - padding - titleSize; this.ctx.textAlign = 'right'; }

          // Draw Desc (Top)
          this.ctx.font = `900 ${descSize}px 'Nunito'`;
          this.ctx.globalAlpha = 0.5;
          this.ctx.fillText(slide.descText, tx, ty);
          
          // Draw Title (Bottom)
          this.ctx.globalAlpha = 1.0;
          this.ctx.font = `900 ${titleSize}px 'Alfa Slab One'`;
          this.ctx.fillText(slide.mainText, tx, ty + titleSize * 0.8);
        }
        this.ctx.restore();
      }

      drawImageContent(slide, ox, oy) {
        const img = slide.img;
        const ratio = Math.min(this.res.w / img.width, this.res.h / img.height) * 0.8;
        const nw = img.width * ratio;
        const nh = img.height * ratio;
        this.ctx.save();
        this.ctx.translate(ox, oy);
        this.ctx.fillStyle = '#1a1a1a';
        this.ctx.fillRect((this.res.w - nw) / 2 - 10, (this.res.h - nh) / 2 - 10, nw + 20, nh + 20);
        this.ctx.drawImage(img, (this.res.w - nw) / 2, (this.res.h - nh) / 2, nw, nh);
        this.ctx.restore();
      }

      drawFrame(slide, ox, oy) {
        this.ctx.fillStyle = '#FFB703';
        this.ctx.fillRect(ox, oy, this.res.w, this.res.h);
        if (slide.type === 'text') this.drawTextContent(slide, ox, oy);
        else this.drawImageContent(slide, ox, oy);
      }

      renderLoop() {
        this.ctx.clearRect(0, 0, this.res.w, this.res.h);

        if (!this.isAnimating) {
          if (this.slides.length > 0) this.drawFrame(this.slides[0], 0, 0);
          else {
            // Default placeholder
            this.ctx.fillStyle = '#FFB703';
            this.ctx.fillRect(0, 0, this.res.w, this.res.h);
            this.ctx.fillStyle = '#1a1a1a';
            this.ctx.font = "900 100px 'Alfa Slab One'";
            this.ctx.textAlign = 'center';
            this.ctx.fillText("READY TO CREATE", this.res.w/2, this.res.h/2);
          }
        } else {
          const current = this.slides[this.playIndex];
          const next = this.slides[this.playIndex + 1];

          this.t += 0.008;
          let progress = 0;
          if (this.t > 0.7) progress = this.ease((this.t - 0.7) / 0.3);

          let ox = 0, oy = 0;
          if (this.direction === 'left') ox = -progress * this.res.w;
          if (this.direction === 'right') ox = progress * this.res.w;
          if (this.direction === 'up') oy = -progress * this.res.h;
          if (this.direction === 'down') oy = progress * this.res.h;

          // Draw current
          this.drawFrame(current, ox, oy);

          // Draw next pushing
          if (next && progress > 0) {
            let nx = ox, ny = oy;
            if (this.direction === 'left') nx += this.res.w;
            if (this.direction === 'right') nx -= this.res.w;
            if (this.direction === 'up') ny += this.res.h;
            if (this.direction === 'down') ny -= this.res.h;
            this.drawFrame(next, nx, ny);
          }

          if (this.t >= 1) {
            if (this.playIndex < this.slides.length - 1) {
              this.playIndex++;
              this.t = 0;
              this.updateSlideList();
            } else {
              this.reset();
              this.showToast("VIDEO FINISHED");
            }
          }
        }

        requestAnimationFrame(() => this.renderLoop());
      }
    }

    window.studio = new TASVideoStudio();
  </script>
</body>
</html>
