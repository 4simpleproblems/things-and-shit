<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAS Studio | Video Base</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --bg: #FFB703; /* Yellow from icon_maker */
      --panel-bg: #ffffff;
      --dark: #1a1a1a;
      --border: 5px solid var(--dark);
      --shadow: 8px 8px 0px #e0e0e0;
      --accent: #70D6FF;
      --danger: #FF0054;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: var(--bg); 
      font-family: 'Nunito', sans-serif; 
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP LEFT INFO */
    .studio-header {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1000;
      pointer-events: none;
    }
    .studio-header h1 {
      font-family: 'Alfa Slab One', serif;
      font-size: 32px;
      color: var(--dark);
      line-height: 1;
      text-transform: lowercase;
    }
    .studio-header p {
      font-weight: 900;
      color: var(--dark);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      margin-top: 5px;
    }

    /* MAIN CONTAINER */
    .app-grid {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100vh;
      width: 100vw;
      padding: 100px 40px 40px;
      gap: 40px;
    }

    /* SIDEBAR CONTROLS */
    .controls {
      background: var(--panel-bg);
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      overflow-y: auto;
    }

    .control-group label {
      display: block;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .input-box {
      width: 100%;
      border: 4px solid var(--dark);
      border-radius: 15px;
      padding: 15px;
      font-family: 'Alfa Slab One', serif;
      font-size: 18px;
      background: #f9f9f9;
      outline: none;
    }

    .btn-action {
      width: 100%;
      padding: 18px;
      border: 4px solid var(--dark);
      border-radius: 20px;
      font-family: 'Alfa Slab One', serif;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 6px 6px 0px var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-action:hover { transform: translateY(-4px); box-shadow: 10px 10px 0px var(--dark); }
    .btn-action:active { transform: translateY(0); box-shadow: 4px 4px 0px var(--dark); }

    .btn-blue { background: var(--accent); }
    .btn-pink { background: var(--danger); color: #fff; }
    .btn-white { background: #fff; }

    /* IMAGE LIST */
    .slide-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slide-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #f0f0f0;
      border: 3px solid var(--dark);
      border-radius: 12px;
      padding: 10px;
      position: relative;
    }
    .slide-thumb {
      width: 60px;
      height: 40px;
      background: #ccc;
      border-radius: 6px;
      object-fit: cover;
      border: 2px solid var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .slide-info { flex: 1; font-weight: 800; font-size: 11px; text-transform: uppercase; }
    
    .slide-actions { display: flex; flex-direction: column; gap: 4px; }
    .action-mini {
      background: #fff;
      border: 2px solid var(--dark);
      border-radius: 4px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }
    .action-mini:hover { background: var(--accent); }

    .type-badge {
      font-family: 'Alfa Slab One', serif;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--dark);
      background: var(--accent);
      margin-left: 5px;
    }

    /* PREVIEW AREA */
    .preview {
      background: #111;
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* OVERLAYS */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--dark);
      color: #fff;
      padding: 15px 30px;
      border-radius: 15px;
      font-family: 'Alfa Slab One', serif;
      font-size: 14px;
      border: 4px solid var(--accent);
      z-index: 2000;
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .toast.active { transform: translateX(-50%) translateY(0); }

    input[type="file"] { display: none; }

  </style>
</head>
<body>

  <div class="studio-header">
    <h1>tas studio<span>.</span></h1>
    <p>video base tool</p>
  </div>

  <div class="app-grid">
    
    <div class="controls">
      <div class="control-group">
        <label>Intro Title</label>
        <textarea id="titleInput" class="input-box" rows="2">HELLO
WORLD</textarea>
      </div>

      <div class="control-group">
        <label>Slide Direction</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <button class="btn-action btn-white" onclick="studio.setDirection('up')">UP</button>
          <button class="btn-action btn-white" onclick="studio.setDirection('down')">DOWN</button>
          <button class="btn-action btn-white" onclick="studio.setDirection('left')">LEFT</button>
          <button class="btn-action btn-white" onclick="studio.setDirection('right')">RIGHT</button>
        </div>
      </div>

      <div class="control-group">
        <label>Content Sequence</label>
        <div class="slide-list" id="slideList">
          <div style="text-align:center; color:#aaa; font-size:11px; font-weight:900; padding:20px;">NO SLIDES ADDED</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
          <button class="btn-action btn-blue" onclick="studio.addTextSlide()">
            <i class="fa-solid fa-font"></i> + TEXT
          </button>
          <button class="btn-action btn-blue" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-image"></i> + IMG
          </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="studio.handleUpload(event)">
      </div>

      <div style="margin-top:auto; display:flex; flex-direction:column; gap:15px;">
        <button class="btn-action btn-pink" onclick="studio.startSequence()">
          <i class="fa-solid fa-play"></i> PLAY VIDEO
        </button>
        <button class="btn-action btn-white" onclick="studio.reset()">
          <i class="fa-solid fa-rotate-left"></i> RESET
        </button>
      </div>
    </div>

    <div class="preview">
      <canvas id="previewCanvas"></canvas>
    </div>

  </div>

  <div class="toast" id="studioToast">READY</div>

  <script>
    class TASVideoStudio {
      constructor() {
        this.canvas = document.getElementById('previewCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.res = { w: 1920, h: 1080 };
        
        this.slides = []; // { type: 'image'|'text', img?: Image, text?: string, name: string }
        this.direction = 'left';
        this.isAnimating = false;
        this.phase = 'idle'; // 'intro', 'slides', 'idle'
        
        this.anim = {
          t: 0,
          currentSlideIndex: -1
        };

        this.init();
      }

      init() {
        this.canvas.width = this.res.w;
        this.canvas.height = this.res.h;
        this.renderLoop();
      }

      setDirection(dir) {
        this.direction = dir;
        this.showToast(`SLIDE DIRECTION: ${dir.toUpperCase()}`);
      }

      addTextSlide() {
        const text = prompt("Enter text for slide:", "NEW SLIDE");
        if (text) {
          this.slides.push({ type: 'text', text: text, name: text.substring(0, 15) });
          this.updateSlideList();
        }
      }

      handleUpload(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              this.slides.push({ type: 'image', img, name: file.name });
              this.updateSlideList();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
        this.showToast(`ADDED ${files.length} IMAGES`);
      }

      updateSlideList() {
        const list = document.getElementById('slideList');
        if (this.slides.length === 0) {
          list.innerHTML = `<div style="text-align:center; color:#aaa; font-size:11px; font-weight:900; padding:20px;">NO SLIDES ADDED</div>`;
          return;
        }
        list.innerHTML = this.slides.map((s, i) => {
          const visual = s.type === 'image' 
            ? `<img src="${s.img.src}" class="slide-thumb">`
            : `<div class="slide-thumb"><i class="fa-solid fa-font"></i></div>`;
          
          return `
            <div class="slide-item">
              ${visual}
              <div class="slide-info">
                ${s.name}
                <span class="type-badge">${s.type}</span>
              </div>
              <div class="slide-actions">
                <div class="action-mini" onclick="studio.moveSlide(${i}, -1)"><i class="fa-solid fa-chevron-up"></i></div>
                <div class="action-mini" onclick="studio.moveSlide(${i}, 1)"><i class="fa-solid fa-chevron-down"></i></div>
              </div>
              <i class="fa-solid fa-trash-can" style="cursor:pointer; color:var(--danger); margin-left: 10px;" onclick="studio.removeSlide(${i})"></i>
            </div>
          `;
        }).join('');
      }

      moveSlide(index, delta) {
        const newIndex = index + delta;
        if (newIndex < 0 || newIndex >= this.slides.length) return;
        const temp = this.slides[index];
        this.slides[index] = this.slides[newIndex];
        this.slides[newIndex] = temp;
        this.updateSlideList();
      }

      removeSlide(index) {
        this.slides.splice(index, 1);
        this.updateSlideList();
      }

      startSequence() {
        if (this.isAnimating) return;
        this.isAnimating = true;
        this.phase = 'intro';
        this.anim.t = 0;
        this.anim.currentSlideIndex = -1;
        this.showToast("STARTING SEQUENCE...");
      }

      reset() {
        this.isAnimating = false;
        this.phase = 'idle';
        this.anim.t = 0;
        this.anim.currentSlideIndex = -1;
        this.showToast("RESET");
      }

      showToast(msg) {
        const t = document.getElementById('studioToast');
        t.innerText = msg;
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 2500);
      }

      ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      drawTextContent(text, ox, oy, scale = 1, fontSize = 180) {
        const lines = text.split('\n');
        this.ctx.save();
        this.ctx.translate(ox, oy);
        this.ctx.scale(scale, scale);
        
        this.ctx.fillStyle = '#1a1a1a';
        this.ctx.font = `900 ${fontSize}px 'Alfa Slab One'`;
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';

        lines.forEach((line, i) => {
          const y = (this.res.h / 2) + (i - (lines.length - 1) / 2) * (fontSize * 0.9);
          this.ctx.fillText(line, this.res.w / 2, y);
        });
        this.ctx.restore();
      }

      drawImageCentered(img, ox, oy) {
        const ratio = Math.min(this.res.w / img.width, this.res.h / img.height) * 0.8;
        const nw = img.width * ratio;
        const nh = img.height * ratio;
        
        this.ctx.save();
        this.ctx.translate(ox, oy);
        this.ctx.fillStyle = '#1a1a1a';
        this.ctx.fillRect((this.res.w - nw) / 2 - 10, (this.res.h - nh) / 2 - 10, nw + 20, nh + 20);
        this.ctx.drawImage(img, (this.res.w - nw) / 2, (this.res.h - nh) / 2, nw, nh);
        this.ctx.restore();
      }

      drawSlideContent(slide, ox, oy) {
        if (slide.type === 'text') {
          this.drawTextContent(slide.text, ox, oy);
        } else {
          this.drawImageCentered(slide.img, ox, oy);
        }
      }

      drawIntro(t) {
        this.ctx.fillStyle = '#FFB703';
        this.ctx.fillRect(0, 0, this.res.w, this.res.h);

        let progress = 0;
        if (t > 0.5) progress = this.ease((t - 0.5) * 2);

        let ox = 0, oy = 0;
        if (this.direction === 'left') ox = -progress * this.res.w;
        if (this.direction === 'right') ox = progress * this.res.w;
        if (this.direction === 'up') oy = -progress * this.res.h;
        if (this.direction === 'down') oy = progress * this.res.h;

        // Intro Text
        this.drawTextContent(document.getElementById('titleInput').value, ox, oy, 1, 240);

        // Next Slide pushing in
        if (progress > 0 && this.slides.length > 0) {
          let nx = ox, ny = oy;
          if (this.direction === 'left') nx += this.res.w;
          if (this.direction === 'right') nx -= this.res.w;
          if (this.direction === 'up') ny += this.res.h;
          if (this.direction === 'down') ny -= this.res.h;
          this.drawSlideContent(this.slides[0], nx, ny);
        }

        if (t >= 1) {
          if (this.slides.length > 0) {
            this.phase = 'slides';
            this.anim.t = 0;
            this.anim.currentSlideIndex = 0;
          } else {
            this.reset();
          }
        }
      }

      drawSlide(index, t) {
        const slide = this.slides[index];
        const nextSlide = this.slides[index + 1];

        this.ctx.fillStyle = '#FFB703';
        this.ctx.fillRect(0, 0, this.res.w, this.res.h);

        let progress = 0;
        if (t > 0.7) progress = this.ease((t - 0.7) / 0.3);

        let ox = 0, oy = 0;
        if (this.direction === 'left') ox = -progress * this.res.w;
        if (this.direction === 'right') ox = progress * this.res.w;
        if (this.direction === 'up') oy = -progress * this.res.h;
        if (this.direction === 'down') oy = progress * this.res.h;

        // Current Slide
        this.drawSlideContent(slide, ox, oy);

        // Next Slide pushing in
        if (nextSlide && progress > 0) {
          let nx = ox, ny = oy;
          if (this.direction === 'left') nx += this.res.w;
          if (this.direction === 'right') nx -= this.res.w;
          if (this.direction === 'up') ny += this.res.h;
          if (this.direction === 'down') ny -= this.res.h;
          this.drawSlideContent(nextSlide, nx, ny);
        }

        if (t >= 1) {
          if (index < this.slides.length - 1) {
            this.anim.t = 0;
            this.anim.currentSlideIndex++;
          } else {
            this.reset();
          }
        }
      }

      renderLoop() {
        this.ctx.clearRect(0, 0, this.res.w, this.res.h);
        if (this.phase === 'idle') this.drawIntro(0);
        else if (this.phase === 'intro') { this.anim.t += 0.01; this.drawIntro(this.anim.t); }
        else if (this.phase === 'slides') { this.anim.t += 0.005; this.drawSlide(this.anim.currentSlideIndex, this.anim.t); }
        requestAnimationFrame(() => this.renderLoop());
      }
    }

    window.studio = new TASVideoStudio();
  </script>
</body>
</html>
