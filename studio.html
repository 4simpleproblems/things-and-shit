<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t.a.s studio | high-performance 2D editor</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&family=Roboto+Mono:wght@700&display=block');

    :root {
      --bg: #f9f9f9;
      --panel-bg: #ffffff;
      --accent: #FFB703;
      --danger: #FF0054;
      --info: #70D6FF;
      --dark: #1a1a1a;
      --border: 5px solid var(--dark);
      --shadow: 10px 10px 0px var(--dark);
      --header-height: 70px;
      --sidebar-width: 300px;
      --timeline-height: 250px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Nunito', sans-serif; 
      background-color: var(--bg); 
      color: var(--dark); 
      overflow: hidden; 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      height: var(--header-height);
      background: var(--dark);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 100;
      border-bottom: 5px solid var(--dark);
    }

    .logo { font-family: 'Alfa Slab One', serif; font-size: 24px; letter-spacing: -1px; }
    .logo span { color: #ccc; }

    .header-actions { display: flex; gap: 15px; }
    .btn {
      padding: 10px 20px;
      border: 3px solid var(--dark);
      border-radius: 12px;
      font-family: 'Alfa Slab One', serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }
    .btn-primary { background: var(--accent); color: var(--dark); box-shadow: 4px 4px 0px rgba(0,0,0,0.2); }
    .btn-secondary { background: #fff; color: var(--dark); box-shadow: 4px 4px 0px rgba(0,0,0,0.1); }
    .btn:hover { transform: translateY(-3px); box-shadow: 8px 8px 0px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0); box-shadow: 2px 2px 0px rgba(0,0,0,0.2); }

    /* MAIN LAYOUT */
    .studio-grid {
      flex: 1;
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr var(--sidebar-width);
      grid-template-rows: 1fr var(--timeline-height);
      overflow: hidden;
    }

    /* PANELS */
    .panel {
      background: var(--panel-bg);
      border: 3px solid var(--dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 15px 20px;
      background: var(--dark);
      color: #fff;
      font-family: 'Alfa Slab One', serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* MEDIA LIBRARY */
    .media-item {
      background: #f0f0f0;
      border: 3px solid var(--dark);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      cursor: grab;
      transition: 0.2s;
    }
    .media-item:hover { border-color: var(--accent); transform: scale(1.02); }
    .media-item i { font-size: 24px; margin-bottom: 10px; display: block; }
    .media-name { font-weight: 900; font-size: 13px; word-break: break-all; }

    /* PREVIEW CANVAS */
    .preview-container {
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: none;
    }
    #mainCanvas {
      background: #000;
      box-shadow: var(--shadow);
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    /* INSPECTOR */
    .inspector-group { margin-bottom: 25px; }
    .inspector-label { 
      font-family: 'Alfa Slab One', serif; 
      font-size: 10px; 
      color: #aaa; 
      margin-bottom: 10px; 
      text-transform: uppercase; 
    }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .input-field {
      background: var(--bg);
      border: 3px solid var(--dark);
      border-radius: 10px;
      padding: 10px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      width: 100%;
    }
    .input-field:focus { outline: none; border-color: var(--accent); }

    /* TIMELINE */
    .timeline-panel {
      grid-column: 1 / span 3;
      border-top: 5px solid var(--dark);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .timeline-toolbar {
      height: 50px;
      background: var(--dark);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
    }

    .timecode { font-family: 'Roboto Mono', monospace; font-size: 18px; color: var(--accent); }

    .timeline-container {
      flex: 1;
      overflow: auto;
      position: relative;
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 100px 50px;
    }

    .track {
      height: 50px;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      align-items: center;
    }

    .clip {
      position: absolute;
      height: 40px;
      background: var(--info);
      border: 3px solid var(--dark);
      border-radius: 8px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 900;
      overflow: hidden;
      white-space: nowrap;
    }
    .clip.selected { background: var(--accent); box-shadow: 6px 6px 0px var(--dark); transform: translateY(-2px); }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--danger);
      z-index: 50;
      pointer-events: none;
    }
    .playhead::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid var(--danger);
    }

    /* NEUTRALIZE CHAT BUBBLE */
    #tas-chat { display: none; }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--dark); border: 2px solid var(--bg); border-radius: 5px; }

  </style>
</head>
<body>

  <header>
    <div class="logo">t.a.s <span>studio</span></div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="studio.undo()"><i class="fa-solid fa-rotate-left"></i> Undo</button>
      <button class="btn btn-primary" onclick="studio.export()"><i class="fa-solid fa-film"></i> Export</button>
    </div>
  </header>

  <div class="studio-grid">
    <!-- ASSETS -->
    <div class="panel">
      <div class="panel-header">Media Library <i class="fa-solid fa-plus"></i></div>
      <div class="panel-content">
        <div class="media-item" draggable="true" ondragstart="studio.onDragMedia(event, 'text')">
          <i class="fa-solid fa-t" style="color: var(--info)"></i>
          <div class="media-name">New Text Layer</div>
        </div>
        <div class="media-item" draggable="true" ondragstart="studio.onDragMedia(event, 'image')">
          <i class="fa-solid fa-image" style="color: var(--accent)"></i>
          <div class="media-name">Placeholder Image</div>
        </div>
        <div id="projectAssets"></div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <!-- INSPECTOR -->
    <div class="panel">
      <div class="panel-header">Inspector <i class="fa-solid fa-sliders"></i></div>
      <div class="panel-content" id="inspectorContent">
        <div style="text-align:center; color: #ccc; margin-top: 50px;">
          <i class="fa-solid fa-mouse-pointer" style="font-size: 40px; margin-bottom: 20px; display: block;"></i>
          <div style="font-weight: 800; font-size: 12px; text-transform: uppercase;">Select a clip to edit properties</div>
        </div>
      </div>
    </div>

    <!-- TIMELINE -->
    <div class="timeline-panel">
      <div class="timeline-toolbar">
        <button class="btn btn-secondary" onclick="studio.togglePlayback()">
          <i class="fa-solid" id="playIcon" class="fa-play"></i>
        </button>
        <div class="timecode" id="timecodeDisplay">00:00:00:00</div>
        <div style="flex:1"></div>
        <div style="font-size: 10px; font-weight: 900; color: #aaa; text-transform: uppercase;">Zoom</div>
        <input type="range" id="zoomRange" min="10" max="200" value="100" style="accent-color: var(--accent)">
      </div>
      <div class="timeline-container" id="timelineContainer">
        <div class="playhead" id="playhead"></div>
        <div id="tracksList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    /**
     * T.A.S STUDIO ENGINE
     * High-Performance 2D Web-Based Non-Linear Editor
     */

    class TASStudio {
      constructor() {
        this.canvas = document.getElementById('mainCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.resolution = { width: 1920, height: 1080 };
        this.fps = 60;
        
        // PROJECT STATE (Normalized JSON)
        this.state = {
          duration: 30000, // 30 seconds
          currentTime: 0,
          zoom: 1,
          tracks: [
            { id: 'track_1', name: 'Graphics', type: 'graphic', clips: [] },
            { id: 'track_2', name: 'Media', type: 'video', clips: [] }
          ],
          selectedClipId: null,
          isPlaying: false
        };

        this.init();
      }

      init() {
        this.setupCanvas();
        this.setupListeners();
        this.renderLoop();
        this.updateTimeline();
      }

      setupCanvas() {
        this.canvas.width = this.resolution.width;
        this.canvas.height = this.resolution.height;
      }

      setupListeners() {
        // Playhead scrubbing
        const container = document.getElementById('timelineContainer');
        container.addEventListener('mousedown', (e) => {
          this.isScrubbing = true;
          this.handleScrub(e);
        });
        window.addEventListener('mousemove', (e) => {
          if (this.isScrubbing) this.handleScrub(e);
        });
        window.addEventListener('mouseup', () => this.isScrubbing = false);

        // Zoom
        document.getElementById('zoomRange').oninput = (e) => {
          this.state.zoom = e.target.value / 100;
          this.updateTimeline();
        };

        // Resize
        window.addEventListener('resize', () => this.updateTimeline());
      }

      handleScrub(e) {
        const rect = document.getElementById('timelineContainer').getBoundingClientRect();
        const scrollLeft = document.getElementById('timelineContainer').scrollLeft;
        const x = e.clientX - rect.left + scrollLeft;
        const timePerPixel = 10 / this.state.zoom; // ms per pixel (base 100px = 1s)
        this.state.currentTime = Math.max(0, Math.min(this.state.duration, x * timePerPixel));
        this.syncPlayhead();
      }

      togglePlayback() {
        this.state.isPlaying = !this.state.isPlaying;
        document.getElementById('playIcon').className = this.state.isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        if (this.state.isPlaying) this.lastFrameTime = performance.now();
      }

      syncPlayhead() {
        const timePerPixel = 10 / this.state.zoom;
        const x = this.state.currentTime / timePerPixel;
        document.getElementById('playhead').style.left = `${x}px`;
        
        // Update timecode display
        const totalSecs = Math.floor(this.state.currentTime / 1000);
        const ms = Math.floor((this.state.currentTime % 1000) / 10);
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        const hours = Math.floor(mins / 60);
        const displayMins = mins % 60;
        
        const pad = (n) => n.toString().padStart(2, '0');
        document.getElementById('timecodeDisplay').innerText = 
          `${pad(hours)}:${pad(displayMins)}:${pad(secs)}:${pad(ms)}`;
      }

      onDragMedia(e, type) {
        e.dataTransfer.setData('type', type);
      }

      addClip(type, startTime) {
        const track = this.state.tracks[0]; // Default to track 1 for now
        const newClip = {
          id: 'clip_' + Date.now(),
          type: type,
          start: startTime,
          duration: 5000,
          name: `New ${type}`,
          properties: {
            x: 960, y: 540,
            scale: 1,
            rotation: 0,
            opacity: 1,
            text: type === 'text' ? 'TAS STUDIO' : '',
            color: '#ffffff',
            fontSize: 100
          },
          keyframes: []
        };
        track.clips.push(newClip);
        this.selectClip(newClip.id);
        this.updateTimeline();
      }

      selectClip(id) {
        this.state.selectedClipId = id;
        this.updateInspector();
        this.updateTimeline();
      }

      updateTimeline() {
        const list = document.getElementById('tracksList');
        const timePerPixel = 10 / this.state.zoom;
        
        list.innerHTML = this.state.tracks.map(track => `
          <div class="track" ondragover="event.preventDefault()" ondrop="studio.handleDrop(event, '${track.id}')">
            ${track.clips.map(clip => {
              const left = clip.start / timePerPixel;
              const width = clip.duration / timePerPixel;
              return `
                <div class="clip ${this.state.selectedClipId === clip.id ? 'selected' : ''}" 
                     style="left: ${left}px; width: ${width}px;"
                     onclick="studio.selectClip('${clip.id}')">
                  ${clip.name}
                </div>
              `;
            }).join('')}
          </div>
        `).join('');
        this.syncPlayhead();
      }

      handleDrop(e, trackId) {
        e.preventDefault();
        const type = e.dataTransfer.getData('type');
        const rect = document.getElementById('timelineContainer').getBoundingClientRect();
        const scrollLeft = document.getElementById('timelineContainer').scrollLeft;
        const x = e.clientX - rect.left + scrollLeft;
        const timePerPixel = 10 / this.state.zoom;
        this.addClip(type, x * timePerPixel);
      }

      updateInspector() {
        const container = document.getElementById('inspectorContent');
        const clip = this.findSelectedClip();
        if (!clip) return;

        container.innerHTML = `
          <div class="inspector-group">
            <div class="inspector-label">General</div>
            <input type="text" class="input-field" value="${clip.name}" oninput="studio.updateClipProp('name', this.value)">
          </div>

          <div class="inspector-group">
            <div class="inspector-label">Transform</div>
            <div class="input-row">
              <div>
                <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">POSITION X</div>
                <input type="number" class="input-field" value="${clip.properties.x}" oninput="studio.updateClipProp('x', parseFloat(this.value))">
              </div>
              <div>
                <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">POSITION Y</div>
                <input type="number" class="input-field" value="${clip.properties.y}" oninput="studio.updateClipProp('y', parseFloat(this.value))">
              </div>
            </div>
            <div class="input-row">
              <div>
                <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">SCALE</div>
                <input type="number" step="0.1" class="input-field" value="${clip.properties.scale}" oninput="studio.updateClipProp('scale', parseFloat(this.value))">
              </div>
              <div>
                <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">ROTATION</div>
                <input type="number" class="input-field" value="${clip.properties.rotation}" oninput="studio.updateClipProp('rotation', parseFloat(this.value))">
              </div>
            </div>
          </div>

          ${clip.type === 'text' ? `
            <div class="inspector-group">
              <div class="inspector-label">Typography</div>
              <div style="margin-bottom: 10px;">
                <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">TEXT CONTENT</div>
                <textarea class="input-field" style="height: 80px;" oninput="studio.updateClipProp('text', this.value)">${clip.properties.text}</textarea>
              </div>
              <div class="input-row">
                <div>
                  <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">SIZE</div>
                  <input type="number" class="input-field" value="${clip.properties.fontSize}" oninput="studio.updateClipProp('fontSize', parseFloat(this.value))">
                </div>
                <div>
                  <div style="font-size: 9px; font-weight: 900; margin-bottom: 5px;">COLOR</div>
                  <input type="color" class="input-field" value="${clip.properties.color}" oninput="studio.updateClipProp('color', this.value)">
                </div>
              </div>
            </div>
          ` : ''}
        `;
      }

      updateClipProp(prop, val) {
        const clip = this.findSelectedClip();
        if (!clip) return;
        if (['x', 'y', 'scale', 'rotation', 'opacity', 'text', 'color', 'fontSize'].includes(prop)) {
          clip.properties[prop] = val;
        } else {
          clip[prop] = val;
        }
        this.updateTimeline();
      }

      findSelectedClip() {
        for (const track of this.state.tracks) {
          const clip = track.clips.find(c => c.id === this.state.selectedClipId);
          if (clip) return clip;
        }
        return null;
      }

      // DETERMINISTIC RENDERING PIPELINE
      renderScene(time) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw in Z-order (Reverse tracks)
        const tracks = [...this.state.tracks].reverse();
        tracks.forEach(track => {
          track.clips.forEach(clip => {
            if (time >= clip.start && time <= clip.start + clip.duration) {
              this.drawClip(clip, time);
            }
          });
        });
      }

      drawClip(clip, time) {
        this.ctx.save();
        
        const props = clip.properties;
        this.ctx.translate(props.x, props.y);
        this.ctx.rotate(props.rotation * Math.PI / 180);
        this.ctx.scale(props.scale, props.scale);
        this.ctx.globalAlpha = props.opacity;

        if (clip.type === 'text') {
          this.ctx.font = `900 ${props.fontSize}px 'Alfa Slab One', serif`;
          this.ctx.fillStyle = props.color;
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(props.text, 0, 0);
        } else if (clip.type === 'image') {
          this.ctx.fillStyle = '#FFB703';
          this.ctx.fillRect(-100, -100, 200, 200);
          this.ctx.strokeStyle = '#fff';
          this.ctx.lineWidth = 10;
          this.ctx.strokeRect(-100, -100, 200, 200);
        }

        this.ctx.restore();
      }

      renderLoop() {
        if (this.state.isPlaying) {
          const now = performance.now();
          const delta = now - this.lastFrameTime;
          this.state.currentTime += delta;
          if (this.state.currentTime > this.state.duration) {
            this.state.currentTime = 0;
          }
          this.lastFrameTime = now;
          this.syncPlayhead();
        }

        this.renderScene(this.state.currentTime);
        requestAnimationFrame(() => this.renderLoop());
      }

      export() {
        showToast("Export Initiated via WebCodecs Architecture...");
        // Placeholder for WebCodecs VideoEncoder implementation
        setTimeout(() => showToast("Export Complete (Simulation). Check Browser console for metadata."), 2000);
        console.log("PROJECT JSON STATE:", JSON.stringify(this.state, null, 2));
      }
      
      undo() {
        showToast("Undo Stack is currently empty.");
      }
    }

    // Global simple toast utility
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: #1a1a1a; color: #fff; padding: 15px 30px; border-radius: 15px;
        font-family: 'Alfa Slab One', serif; font-size: 12px; border: 4px solid #70D6FF;
        z-index: 9999; box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        animation: toast-in 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      `;
      toast.innerText = msg.toUpperCase();
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = '0.4s';
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes toast-in { from { transform: translate(-50%, 100px); } to { transform: translate(-50%, 0); } }`;
    document.head.appendChild(style);

    window.studio = new TASStudio();

  </script>
</body>
</html>
