<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t.a.s studio | things and s***.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --bg: #f0f0f0;
      --panel-bg: #ffffff;
      --accent: #FFB703;
      --danger: #FF0054;
      --info: #70D6FF;
      --dark: #1a1a1a;
      --border: 5px solid var(--dark);
      --shadow: 8px 8px 0px #e0e0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: var(--bg); 
      font-family: 'Nunito', sans-serif; 
      overflow: hidden; 
      height: 100vh;
      width: 100vw;
    }

    /* TOP LEFT HEADER */
    .studio-info {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1000;
      pointer-events: none;
    }
    .studio-info h1 {
      font-family: 'Alfa Slab One', serif;
      font-size: 32px;
      color: var(--dark);
      letter-spacing: -1px;
      line-height: 1;
    }
    .studio-info h1 span {
      display: inline-block; padding: 2px 12px; background: #fff; border: 4px solid var(--dark); border-radius: 10px;
      transform: rotate(-3deg); margin-left: 5px;
    }
    .studio-info p {
      font-weight: 800; color: #999; text-transform: uppercase; letter-spacing: 3px; font-size: 10px; margin-top: 5px;
    }

    /* SLIDING VIEWPORT */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
    }

    .frame {
      position: absolute;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 60px 60px;
    }

    /* Frame Grid Layout:
       (0,0) Assets    | (1,0) Studio (Preview)
       (0,1) Timeline  | (1,1) Export/Settings
    */
    .frame-assets   { top: 0; left: 0; background: var(--bg); }
    .frame-studio   { top: 0; left: 100vw; background: var(--bg); }
    .frame-timeline { top: 100vh; left: 0; background: var(--bg); }
    .frame-export   { top: 100vh; left: 100vw; background: var(--bg); }

    /* CONTENT PANELS (Styled like icon_maker) */
    .panel {
      background: var(--panel-bg);
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 30px;
      border-bottom: 5px solid var(--dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-family: 'Alfa Slab One', serif;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .panel-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    /* NAVIGATION BUTTONS */
    .nav-controls {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px;
      gap: 15px;
    }

    .nav-btn {
      width: 60px;
      height: 60px;
      background: #fff;
      border: 4px solid var(--dark);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #ccc;
      transition: all 0.2s;
    }
    .nav-btn:hover { transform: translateY(-2px); box-shadow: 6px 6px 0px #ccc; }
    .nav-btn:active { transform: translateY(0); box-shadow: 2px 2px 0px #ccc; }
    .nav-btn.active { background: var(--accent); box-shadow: 4px 4px 0px var(--dark); }

    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* STUDIO SPECIFIC ELEMENTS */
    #mainCanvas {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 15px;
      object-fit: contain;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
    }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .asset-item {
      background: #f9f9f9;
      border: 4px solid var(--dark);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      cursor: grab;
      transition: 0.2s;
    }
    .asset-item:hover { transform: scale(1.05); border-color: var(--accent); }
    .asset-item i { font-size: 40px; margin-bottom: 15px; display: block; color: var(--info); }
    .asset-item span { font-weight: 900; font-size: 14px; text-transform: uppercase; }

    .control-group { margin-bottom: 25px; }
    .control-group label { display: block; font-weight: 900; margin-bottom: 10px; font-size: 12px; text-transform: uppercase; color: #333; }
    
    .input-box {
      width: 100%; border: 4px solid var(--dark); border-radius: 15px; padding: 12px;
      font-family: 'Alfa Slab One', serif; font-size: 16px; outline: none;
      background: #f9f9f9;
    }

    .slider {
      -webkit-appearance: none; width: 100%; height: 10px; border-radius: 5px;
      background: #e8e8e8; outline: none; border: 2px solid var(--dark);
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 25px; height: 25px; border-radius: 50%;
      background: var(--accent); border: 4px solid var(--dark); cursor: pointer;
    }

    .action-btn {
      width: 100%; padding: 15px; background: var(--accent); border: 4px solid var(--dark);
      border-radius: 15px; font-family: 'Alfa Slab One', serif; font-size: 18px; cursor: pointer;
      box-shadow: 4px 4px 0px var(--dark); transition: 0.2s;
    }
    .action-btn:hover { transform: translateY(-3px); box-shadow: 8px 8px 0px var(--dark); }

    /* SIMPLE TOAST */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--dark); color: #fff; padding: 12px 25px; border-radius: 12px;
      font-family: 'Alfa Slab One', serif; font-size: 12px; border: 4px solid var(--info);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); z-index: 10000;
    }
    .toast.active { transform: translateX(-50%) translateY(0); }

  </style>
</head>
<body>

  <div class="studio-info">
    <h1>studio<span>.</span></h1>
    <p>things-and-shit.org</p>
  </div>

  <div class="viewport" id="mainViewport">
    
    <!-- FRAME 1: ASSETS (0,0) -->
    <div class="frame frame-assets">
      <div class="panel">
        <div class="panel-header">
          <h2>Media Library</h2>
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <div class="panel-content">
          <div class="asset-grid">
            <div class="asset-item" draggable="true" ondragstart="studio.drag(event, 'text')">
              <i class="fa-solid fa-font"></i>
              <span>Text Layer</span>
            </div>
            <div class="asset-item" draggable="true" ondragstart="studio.drag(event, 'shape')">
              <i class="fa-solid fa-shapes"></i>
              <span>Shape</span>
            </div>
            <div class="asset-item" draggable="true" ondragstart="studio.drag(event, 'image')">
              <i class="fa-solid fa-image"></i>
              <span>Image</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FRAME 2: STUDIO PREVIEW (1,0) -->
    <div class="frame frame-studio">
      <div class="panel">
        <div class="panel-header">
          <h2>Live Preview</h2>
          <div style="display:flex; gap:10px;">
            <button class="nav-btn" style="width:40px; height:40px; font-size:14px;" onclick="studio.togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
            <button class="nav-btn" style="width:40px; height:40px; font-size:14px;" onclick="studio.reset()"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
        </div>
        <div class="panel-content" style="background:#111; display:flex; align-items:center; justify-content:center;">
          <canvas id="mainCanvas"></canvas>
        </div>
      </div>
    </div>

    <!-- FRAME 3: TIMELINE (0,1) -->
    <div class="frame frame-timeline">
      <div class="panel">
        <div class="panel-header">
          <h2>Timeline & Keyframes</h2>
          <span id="timecode" style="font-family:'Roboto Mono'; font-weight:700; color:var(--accent);">00:00:00</span>
        </div>
        <div class="panel-content">
          <div class="control-group">
            <label>Scrub Timeline</label>
            <input type="range" class="slider" id="timelineScrubber" min="0" max="1000" value="0">
          </div>
          <div id="layerList"></div>
          <div style="text-align:center; color:#ccc; padding-top:40px;">
            <i class="fa-solid fa-layer-group" style="font-size:30px; margin-bottom:10px; display:block;"></i>
            <span style="font-weight:900; text-transform:uppercase; font-size:11px;">Drag assets here to add layers</span>
          </div>
        </div>
      </div>
    </div>

    <!-- FRAME 4: EXPORT (1,1) -->
    <div class="frame frame-export">
      <div class="panel">
        <div class="panel-header">
          <h2>Export & Settings</h2>
          <i class="fa-solid fa-gear"></i>
        </div>
        <div class="panel-content">
          <div class="control-group">
            <label>Project Name</label>
            <input type="text" class="input-box" value="MY AWESOME CLIP">
          </div>
          <div class="control-group">
            <label>Resolution</label>
            <select class="input-box" style="font-family:'Nunito'">
              <option>1920x1080 (HD)</option>
              <option>1080x1920 (Vertical)</option>
              <option>1080x1080 (Square)</option>
            </select>
          </div>
          <div class="control-group">
            <label>Export Format</label>
            <div style="display:flex; gap:10px;">
              <button class="action-btn" style="background:var(--info)" onclick="studio.export('mp4')">MP4</button>
              <button class="action-btn" style="background:var(--accent)" onclick="studio.export('gif')">GIF</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-controls">
    <button class="nav-btn btn-up" onclick="studio.move(0, -1)"><i class="fa-solid fa-chevron-up"></i></button>
    <button class="nav-btn btn-left" onclick="studio.move(-1, 0)"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="nav-btn btn-down" onclick="studio.move(0, 1)"><i class="fa-solid fa-chevron-down"></i></button>
    <button class="nav-btn btn-right" onclick="studio.move(1, 0)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <div class="toast" id="studioToast">Project Saved</div>

  <script>
    class StudioEngine {
      constructor() {
        this.viewport = document.getElementById('mainViewport');
        this.canvas = document.getElementById('mainCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.pos = { x: 1, y: 0 }; // Start at Studio Preview
        
        this.isPlaying = false;
        this.currentTime = 0;
        
        this.init();
      }

      init() {
        this.updateView();
        this.setupCanvas();
        this.loop();
      }

      setupCanvas() {
        this.canvas.width = 1920;
        this.canvas.height = 1080;
      }

      move(dx, dy) {
        this.pos.x = Math.max(0, Math.min(1, this.pos.x + dx));
        this.pos.y = Math.max(0, Math.min(1, this.pos.y + dy));
        this.updateView();
      }

      updateView() {
        const tx = this.pos.x * -100;
        const ty = this.pos.y * -100;
        this.viewport.style.transform = `translate(${tx}vw, ${ty}vh)`;
        
        // Highlight active nav buttons
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        if (this.pos.y > 0) document.querySelector('.btn-up').classList.add('active');
        if (this.pos.y < 1) document.querySelector('.btn-down').classList.add('active');
        if (this.pos.x > 0) document.querySelector('.btn-left').classList.add('active');
        if (this.pos.x < 1) document.querySelector('.btn-right').classList.add('active');
      }

      drag(e, type) {
        e.dataTransfer.setData('type', type);
        this.showToast(`Dragging ${type}...`);
      }

      togglePlay() {
        this.isPlaying = !this.isPlaying;
        document.getElementById('playIcon').className = this.isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        this.showToast(this.isPlaying ? "Playing Timeline" : "Paused");
      }

      reset() {
        this.currentTime = 0;
        document.getElementById('timelineScrubber').value = 0;
        this.showToast("Reset to Start");
      }

      export(fmt) {
        this.showToast(`Exporting as ${fmt.toUpperCase()}...`);
        setTimeout(() => this.showToast("Export Ready!"), 2000);
      }

      showToast(msg) {
        const t = document.getElementById('studioToast');
        t.innerText = msg.toUpperCase();
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 3000);
      }

      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw grid
        this.ctx.strokeStyle = '#333';
        this.ctx.lineWidth = 2;
        for(let i=0; i<this.canvas.width; i+=100) {
          this.ctx.beginPath(); this.ctx.moveTo(i, 0); this.ctx.lineTo(i, this.canvas.height); this.ctx.stroke();
        }
        for(let i=0; i<this.canvas.height; i+=100) {
          this.ctx.beginPath(); this.ctx.moveTo(0, i); this.ctx.lineTo(this.canvas.width, i); this.ctx.stroke();
        }

        // Draw animated placeholder
        const time = Date.now() / 1000;
        this.ctx.save();
        this.ctx.translate(960, 540);
        this.ctx.rotate(Math.sin(time) * 0.1);
        this.ctx.fillStyle = '#FFB703';
        this.ctx.font = "900 150px 'Alfa Slab One'";
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText("T.A.S STUDIO", 0, 0);
        this.ctx.strokeStyle = '#fff';
        this.ctx.lineWidth = 8;
        this.ctx.strokeText("T.A.S STUDIO", 0, 0);
        this.ctx.restore();

        if (this.isPlaying) {
          this.currentTime = (this.currentTime + 1) % 1000;
          document.getElementById('timelineScrubber').value = this.currentTime;
          
          const s = Math.floor(this.currentTime / 60);
          const f = this.currentTime % 60;
          document.getElementById('timecode').innerText = `00:00:${s.toString().padStart(2,'0')}:${f.toString().padStart(2,'0')}`;
        }

        requestAnimationFrame(() => this.loop());
      }
    }

    window.studio = new StudioEngine();
  </script>

</body>
</html>
