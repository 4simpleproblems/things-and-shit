<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAS Studio | Dynamic Video Base</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --bg: #FFB703; 
      --panel-bg: #ffffff;
      --dark: #1a1a1a;
      --border: 5px solid var(--dark);
      --shadow: 8px 8px 0px #e0e0e0;
      --accent: #70D6FF;
      --danger: #FF0054;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: var(--bg); 
      font-family: 'Nunito', sans-serif; 
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .studio-header {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1000;
      pointer-events: none;
    }
    .studio-header h1 {
      font-family: 'Alfa Slab One', serif;
      font-size: 32px;
      color: var(--dark);
      line-height: 1;
      text-transform: lowercase;
    }
    .studio-header p {
      font-weight: 900;
      color: var(--dark);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      margin-top: 5px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
      width: 100vw;
      padding: 100px 40px 40px;
      gap: 40px;
    }

    .controls {
      background: var(--panel-bg);
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: hidden;
    }

    .control-group label {
      display: block;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      color: #aaa;
    }

    .btn-action {
      width: 100%;
      padding: 15px;
      border: 4px solid var(--dark);
      border-radius: 18px;
      font-family: 'Alfa Slab One', serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 4px 4px 0px var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-transform: uppercase;
    }
    .btn-action:hover { transform: translateY(-3px); box-shadow: 6px 6px 0px var(--dark); }
    .btn-action:active { transform: translateY(0); box-shadow: 2px 2px 0px var(--dark); }

    .btn-blue { background: var(--accent); }
    .btn-pink { background: var(--danger); color: #fff; }
    .btn-white { background: #fff; }

    .slide-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }
    
    .slide-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #f9f9f9;
      border: 4px solid var(--dark);
      border-radius: 15px;
      padding: 12px;
      cursor: grab;
      position: relative;
      transition: 0.2s, transform 0.1s;
      user-select: none;
    }
    .slide-item:active { cursor: grabbing; transform: scale(0.98); }
    .slide-item.dragging { opacity: 0.5; border-style: dashed; background: #eee; }
    .slide-item.active { border-color: var(--accent); background: #e8f8ff; }
    
    .slide-index {
      width: 24px; height: 24px; background: var(--dark); color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: 'Alfa Slab One', serif; font-size: 10px;
    }

    .slide-type-icon { font-size: 18px; color: var(--dark); width: 25px; text-align: center; }

    .slide-controls { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .action-icon { cursor: pointer; transition: 0.1s; font-size: 16px; }
    .action-icon:hover { transform: scale(1.2); color: var(--danger); }
    .action-icon.edit:hover { color: var(--accent); }

    .preview {
      background: #111;
      border: var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .canvas-container { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    .playback-bar {
      width: 100%;
      background: var(--dark);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-top: 5px solid var(--dark);
    }
    .scrubber-container { flex: 1; height: 10px; background: #333; border-radius: 5px; position: relative; cursor: pointer; }
    .scrubber-progress { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 5px; width: 0%; }
    .scrubber-handle { 
      position: absolute; top: 50%; width: 20px; height: 20px; background: #fff; 
      border: 3px solid var(--dark); border-radius: 50%; transform: translate(-50%, -50%); 
    }
    .playback-btn { 
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; 
      transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .playback-btn:hover { color: var(--accent); transform: scale(1.1); }

    .modal-content {
      background: #fff; border: var(--border); border-radius: 30px;
      width: 100%; max-width: 650px; padding: 40px; box-shadow: 20px 20px 0px var(--dark);
      max-height: 90vh; overflow-y: auto;
    }
    .input-box {
      width: 100%; border: 4px solid var(--dark); border-radius: 15px; padding: 12px;
      font-family: 'Alfa Slab One', serif; font-size: 16px; outline: none; margin-bottom: 15px; background: #f9f9f9;
    }
    .select-box {
      width: 100%; border: 4px solid var(--dark); border-radius: 15px; padding: 12px;
      font-family: 'Nunito', sans-serif; font-weight: 900; background: #f9f9f9; margin-bottom: 15px;
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--dark); color: #fff; padding: 15px 30px; border-radius: 15px;
      font-family: 'Alfa Slab One', serif; font-size: 14px; border: 4px solid var(--accent);
      z-index: 4000; transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .toast.active { transform: translateX(-50%) translateY(0); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="studio-header">
    <h1>tas studio<span>.</span></h1>
    <p>dynamic video tool</p>
  </div>

  <div class="app-grid">
    <div class="controls">
      <div class="control-group" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <label>Slide Sequence (Drag to reorder)</label>
        <div class="slide-list" id="slideList" style="flex:1; overflow-y:auto; padding-right:5px;">
          <div style="text-align:center; color:#aaa; font-size:11px; font-weight:900; padding:20px;">NO SLIDES</div>
        </div>
      </div>

      <div class="control-group">
        <div class="grid-2">
          <button class="btn-action btn-blue" onclick="studio.addNewSlide('text')">
            <i class="fa-solid fa-plus"></i> TEXT
          </button>
          <button class="btn-action btn-blue" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-plus"></i> IMG
          </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="studio.handleUpload(event)">
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn-action btn-blue" onclick="studio.openExport()">
          <i class="fa-solid fa-file-export"></i> PROJECT & EXPORT
        </button>
      </div>
    </div>

    <div class="preview">
      <div class="canvas-container">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="playback-bar">
        <button class="playback-btn" onclick="studio.togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button class="playback-btn" onclick="studio.reset()"><i class="fa-solid fa-rotate-left"></i></button>
        <div class="scrubber-container" id="scrubberContainer">
          <div class="scrubber-progress" id="scrubberProgress"></div>
          <div class="scrubber-handle" id="scrubberHandle"></div>
        </div>
        <div id="timecodeDisplay" style="color:#fff; font-family:'Roboto Mono'; font-weight:900; font-size:12px; min-width:80px;">00:00</div>
      </div>
    </div>
  </div>

  <!-- EXPORT MODAL -->
  <div class="modal" id="exportModal">
    <div class="modal-content">
      <h2 style="font-family:'Alfa Slab One'; margin-bottom:20px; text-transform:uppercase;">Project & Export</h2>
      
      <div class="control-group">
        <label>Save Project</label>
        <div class="grid-2">
          <button class="btn-action btn-white" onclick="studio.downloadProject()">.TAS-STUDIO</button>
          <button class="btn-action btn-white" onclick="studio.copyProject()">COPY JSON</button>
        </div>
      </div>

      <div class="control-group">
        <label>Import Project</label>
        <button class="btn-action btn-white" onclick="document.getElementById('importInput').click()">
          <i class="fa-solid fa-file-import"></i> UPLOAD .TAS-STUDIO
        </button>
        <input type="file" id="importInput" accept=".tas-studio,application/json" onchange="studio.handleImport(event)">
      </div>

      <div class="control-group">
        <label>Video Export</label>
        <div class="grid-2">
          <button class="btn-action btn-blue" onclick="studio.exportVideo('webm')">WEBM</button>
          <button class="btn-action btn-blue" onclick="studio.exportVideo('mp4')">MP4</button>
        </div>
      </div>

      <button class="btn-action btn-white" onclick="studio.closeExport()">Close</button>
    </div>
  </div>

  <!-- SLIDE EDITOR MODAL -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2 style="font-family:'Alfa Slab One'; margin-bottom:20px; text-transform:uppercase;">Slide Properties</h2>
      
      <div class="grid-2">
        <div class="control-group">
          <label>Direction</label>
          <select id="modalDirection" class="select-box">
            <option value="up">UP</option>
            <option value="down">DOWN</option>
            <option value="left">LEFT</option>
            <option value="right">RIGHT</option>
          </select>
        </div>
        <div class="control-group">
          <label>Stay (ms)</label>
          <input type="number" id="modalDuration" class="input-box" step="500" min="500">
        </div>
      </div>

      <div id="textOnlyFields">
        <label>Main Text</label>
        <textarea id="modalMainText" class="input-box" rows="2"></textarea>
        
        <label>Layout Style</label>
        <select id="modalLayout" class="select-box" onchange="studio.toggleModalFields()">
          <option value="center">Center</option>
          <option value="intro-alignable">Intro, Alignable</option>
        </select>

        <div id="alignableFields" style="display:none;">
          <label>Description (Under Title)</label>
          <textarea id="modalDescText" class="input-box" rows="2"></textarea>
          
          <label>Corner Alignment</label>
          <select id="modalAlign" class="select-box">
            <option value="tl">Top Left</option>
            <option value="tr">Top Right</option>
            <option value="bl">Bottom Left</option>
            <option value="br">Bottom Right</option>
          </select>
        </div>
      </div>

      <div id="imageOnlyFields" style="display:none;">
        <label>Fitting Mode</label>
        <select id="modalFitting" class="select-box">
          <option value="floating">Floating (Centered + Pad)</option>
          <option value="cover">Cover (Fill Slide)</option>
          <option value="contain">Contain (Black Bars)</option>
          <option value="stretch">Stretch (Squash to Fit)</option>
        </select>

        <label>Outline (for Floating)</label>
        <select id="modalOutline" class="select-box">
          <option value="on">Enabled</option>
          <option value="off">Disabled</option>
        </select>

        <label>Overlay Text</label>
        <textarea id="modalImgOverlayText" class="input-box" rows="2" placeholder="Overlay text..."></textarea>
        
        <div class="grid-2">
          <div>
            <label>Text Color</label>
            <input type="color" id="modalOverlayTextColor" class="input-box" value="#ffffff">
          </div>
          <div>
            <label>BG Color</label>
            <input type="color" id="modalOverlayBgColor" class="input-box" value="#000000">
          </div>
        </div>
        
        <div class="grid-2">
          <div>
            <label>Position</label>
            <select id="modalOverlayPos" class="select-box">
              <option value="bottom">Bottom</option>
              <option value="top">Top</option>
              <option value="middle">Middle</option>
            </select>
          </div>
          <div>
            <label>BG Opacity</label>
            <input type="range" id="modalOverlayOpacity" class="slider" min="0" max="1" step="0.1" value="0.4">
          </div>
        </div>
      </div>

      <div class="grid-2">
        <button class="btn-action btn-blue" onclick="studio.saveEdit()">Save</button>
        <button class="btn-action btn-white" onclick="studio.closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="studioToast">READY</div>

  <script>
    class TASVideoStudio {
      constructor() {
        this.canvas = document.getElementById('previewCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.res = { w: 1920, h: 1080 };
        this.slides = []; 
        this.isAnimating = false;
        this.currentTime = 0; // Absolute time in ms
        this.editingIndex = -1;
        this.draggedItem = null;
        this.recorder = null;
        this.recordedChunks = [];

        this.init();
      }

      init() {
        this.canvas.width = this.res.w;
        this.canvas.height = this.res.h;
        this.setupScrubber();
        this.renderLoop();
      }

      setupScrubber() {
        const container = document.getElementById('scrubberContainer');
        const handleScrub = (e) => {
          const rect = container.getBoundingClientRect();
          const x = (e.type === 'touchmove' || e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
          const pos = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
          this.seekToPercent(pos);
        };

        container.addEventListener('mousedown', (e) => { this.isScrubbing = true; handleScrub(e); });
        window.addEventListener('mousemove', (e) => { if (this.isScrubbing) handleScrub(e); });
        window.addEventListener('mouseup', () => { this.isScrubbing = false; });
      }

      getTotalDuration() {
        return this.slides.reduce((acc, s) => acc + s.duration + 700, 0);
      }

      seekToPercent(percent) {
        const total = this.getTotalDuration();
        this.currentTime = percent * total;
        if (!this.isAnimating) this.drawAtTime(this.currentTime);
      }

      togglePlay() {
        if (this.slides.length === 0) return;
        this.isAnimating = !this.isAnimating;
        document.getElementById('playIcon').className = this.isAnimating ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        if (this.isAnimating && this.currentTime >= this.getTotalDuration()) this.currentTime = 0;
      }

      reset() {
        this.isAnimating = false;
        this.currentTime = 0;
        document.getElementById('playIcon').className = 'fa-solid fa-play';
        this.updateSlideList();
        this.drawAtTime(0);
      }

      addNewSlide(type) {
        this.slides.push({
          type: type,
          direction: 'left',
          duration: 3000,
          layout: 'center',
          alignment: 'tl',
          mainText: 'NEW SLIDE',
          descText: '',
          fitting: 'floating',
          outline: 'on',
          overlayText: '',
          overlayTextColor: '#ffffff',
          overlayBgColor: '#000000',
          overlayPos: 'bottom',
          overlayOpacity: 0.4,
          img: null
        });
        this.updateSlideList();
        this.openEdit(this.slides.length - 1);
      }

      handleUpload(e) {
        const files = Array.from(e.target.files);
        let loaded = 0;
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              this.slides.push({
                type: 'image', img: img, direction: 'left', duration: 3000, fitting: 'floating', outline: 'on', 
                overlayText: '', overlayTextColor: '#ffffff', overlayBgColor: '#000000', overlayPos: 'bottom', overlayOpacity: 0.4
              });
              loaded++;
              if (loaded === files.length) { this.updateSlideList(); this.showToast(`ADDED ${files.length} IMAGES`); }
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            this.slides = data.map(s => {
              if (s.type === 'image' && s.imgData) {
                const img = new Image();
                img.src = s.imgData;
                s.img = img;
              }
              return s;
            });
            this.updateSlideList();
            this.closeExport();
            this.showToast("PROJECT IMPORTED");
          } catch(e) { this.showToast("INVALID PROJECT FILE"); }
        };
        reader.readAsText(file);
      }

      updateSlideList() {
        const list = document.getElementById('slideList');
        if (this.slides.length === 0) {
          list.innerHTML = `<div style="text-align:center; color:#aaa; font-size:11px; font-weight:900; padding:20px;">NO SLIDES</div>`;
          return;
        }
        
        // Find which slide index is currently active based on currentTime
        let activeIdx = -1;
        let elapsed = 0;
        for(let i=0; i<this.slides.length; i++) {
          const total = this.slides[i].duration + 700;
          if (this.currentTime >= elapsed && this.currentTime < elapsed + total) { activeIdx = i; break; }
          elapsed += total;
        }

        list.innerHTML = this.slides.map((s, i) => `
          <div class="slide-item ${activeIdx === i ? 'active' : ''}" 
               draggable="true" 
               onclick="studio.previewSlide(${i})"
               ondragstart="studio.handleDragStart(event, ${i})"
               ondragover="event.preventDefault()"
               ondrop="studio.handleDrop(event, ${i})">
            <div class="slide-index">${i + 1}</div>
            <div class="slide-type-icon">
              <i class="fa-solid ${s.type === 'image' ? 'fa-image' : 'fa-font'}"></i>
            </div>
            <div class="slide-controls">
              <i class="fa-solid fa-pen-to-square action-icon edit" onclick="event.stopPropagation(); studio.openEdit(${i})"></i>
              <i class="fa-solid fa-trash-can action-icon" onclick="event.stopPropagation(); studio.removeSlide(${i})"></i>
            </div>
          </div>
        `).join('');
      }

      previewSlide(index) {
        let elapsed = 0;
        for(let i=0; i<index; i++) { elapsed += this.slides[i].duration + 700; }
        this.currentTime = elapsed;
        this.isAnimating = false;
        document.getElementById('playIcon').className = 'fa-solid fa-play';
        this.updateSlideList();
        this.drawAtTime(this.currentTime);
      }

      openEdit(index) {
        const s = this.slides[index];
        this.editingIndex = index;
        document.getElementById('editModal').classList.add('active');
        document.getElementById('modalDirection').value = s.direction;
        document.getElementById('modalDuration').value = s.duration;

        if (s.type === 'text') {
          document.getElementById('textOnlyFields').style.display = 'block';
          document.getElementById('imageOnlyFields').style.display = 'none';
          document.getElementById('modalMainText').value = s.mainText;
          document.getElementById('modalDescText').value = s.descText;
          document.getElementById('modalLayout').value = s.layout;
          document.getElementById('modalAlign').value = s.alignment;
          this.toggleModalFields();
        } else {
          document.getElementById('textOnlyFields').style.display = 'none';
          document.getElementById('imageOnlyFields').style.display = 'block';
          document.getElementById('modalFitting').value = s.fitting;
          document.getElementById('modalOutline').value = s.outline;
          document.getElementById('modalImgOverlayText').value = s.overlayText || '';
          document.getElementById('modalOverlayTextColor').value = s.overlayTextColor || '#ffffff';
          document.getElementById('modalOverlayBgColor').value = s.overlayBgColor || '#000000';
          document.getElementById('modalOverlayPos').value = s.overlayPos || 'bottom';
          document.getElementById('modalOverlayOpacity').value = s.overlayOpacity || 0.4;
        }
      }

      saveEdit() {
        const s = this.slides[this.editingIndex];
        s.direction = document.getElementById('modalDirection').value;
        s.duration = parseInt(document.getElementById('modalDuration').value) || 3000;
        if (s.type === 'text') {
          s.mainText = document.getElementById('modalMainText').value;
          s.descText = document.getElementById('modalDescText').value;
          s.layout = document.getElementById('modalLayout').value;
          s.alignment = document.getElementById('modalAlign').value;
        } else {
          s.fitting = document.getElementById('modalFitting').value;
          s.outline = document.getElementById('modalOutline').value;
          s.overlayText = document.getElementById('modalImgOverlayText').value;
          s.overlayTextColor = document.getElementById('modalOverlayTextColor').value;
          s.overlayBgColor = document.getElementById('modalOverlayBgColor').value;
          s.overlayPos = document.getElementById('modalOverlayPos').value;
          s.overlayOpacity = parseFloat(document.getElementById('modalOverlayOpacity').value);
        }
        this.updateSlideList();
        this.drawAtTime(this.currentTime);
        this.closeModal();
      }

      drawImageContent(slide, ox, oy) {
        const img = slide.img;
        let dw, dh, dx, dy;
        const mode = slide.fitting;

        this.ctx.save();
        this.ctx.translate(ox, oy);

        if (mode === 'floating') {
          const ratio = Math.min(this.res.w / img.width, this.res.h / img.height) * 0.8;
          dw = img.width * ratio; dh = img.height * ratio;
          dx = (this.res.w - dw) / 2; dy = (this.res.h - dh) / 2;
          if (slide.outline === 'on') {
            this.ctx.fillStyle = '#1a1a1a';
            this.ctx.fillRect(dx - 10, dy - 10, dw + 20, dh + 20);
          }
        } else if (mode === 'cover') {
          const ratio = Math.max(this.res.w / img.width, this.res.h / img.height);
          dw = img.width * ratio; dh = img.height * ratio;
          dx = (this.res.w - dw) / 2; dy = (this.res.h - dh) / 2;
        } else if (mode === 'contain') {
          const ratio = Math.min(this.res.w / img.width, this.res.h / img.height);
          dw = img.width * ratio; dh = img.height * ratio;
          dx = (this.res.w - dw) / 2; dy = (this.res.h - dh) / 2;
        } else if (mode === 'stretch') {
          dw = this.res.w; dh = this.res.h; dx = 0; dy = 0;
        }

        this.ctx.drawImage(img, dx, dy, dw, dh);

        if (slide.overlayText) {
          const barH = 150;
          let barY = this.res.h - barH;
          if (slide.overlayPos === 'top') barY = 0;
          if (slide.overlayPos === 'middle') barY = (this.res.h - barH) / 2;

          this.ctx.globalAlpha = slide.overlayOpacity;
          this.ctx.fillStyle = slide.overlayBgColor;
          this.ctx.fillRect(0, barY, this.res.w, barH);
          
          this.ctx.globalAlpha = 1.0;
          this.ctx.fillStyle = slide.overlayTextColor;
          this.ctx.font = "900 60px 'Alfa Slab One'";
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(slide.overlayText.toUpperCase(), this.res.w / 2, barY + barH/2);
        }
        this.ctx.restore();
      }

      drawAtTime(time) {
        this.ctx.clearRect(0, 0, this.res.w, this.res.h);
        if (this.slides.length === 0) return;

        let elapsed = 0;
        let found = false;

        for(let i=0; i<this.slides.length; i++) {
          const current = this.slides[i];
          const next = this.slides[i+1];
          const stayTime = current.duration;
          const transTime = 700;
          const total = stayTime + transTime;

          if (time >= elapsed && time < elapsed + total) {
            const slideT = (time - elapsed) / total;
            const stayPercent = stayTime / total;
            let progress = 0;
            if (slideT > stayPercent) progress = this.ease((slideT - stayPercent) / (1 - stayPercent));

            const dir = current.direction;
            let ox = 0, oy = 0;
            if (dir === 'left') ox = -progress * this.res.w;
            else if (dir === 'right') ox = progress * this.res.w;
            else if (dir === 'up') oy = -progress * this.res.h;
            else if (dir === 'down') oy = progress * this.res.h;

            this.drawFrame(current, ox, oy);

            if (next && progress > 0) {
              let nx = ox, ny = oy;
              if (dir === 'left') nx += this.res.w;
              else if (dir === 'right') nx -= this.res.w;
              else if (dir === 'up') ny += this.res.h;
              else if (dir === 'down') ny -= this.res.h;
              this.drawFrame(next, nx, ny);
            }
            found = true;
            break;
          }
          elapsed += total;
        }

        if (!found) this.drawFrame(this.slides[this.slides.length - 1], 0, 0);

        // Update UI
        const totalDur = this.getTotalDuration();
        const percent = totalDur > 0 ? (time / totalDur) * 100 : 0;
        document.getElementById('scrubberProgress').style.width = `${percent}%`;
        document.getElementById('scrubberHandle').style.left = `${percent}%`;
        
        const pad = (n) => Math.floor(n).toString().padStart(2, '0');
        const s = (time / 1000) % 60;
        const m = (time / 60000) % 60;
        document.getElementById('timecodeDisplay').innerText = `${pad(m)}:${pad(s)}`;
      }

      renderLoop() {
        if (this.isAnimating && !this.isScrubbing) {
          this.currentTime += 16.66;
          if (this.currentTime >= this.getTotalDuration()) {
            if (this.recorder && this.recorder.state === "recording") this.recorder.stop();
            this.reset();
            this.showToast("VIDEO FINISHED");
          } else {
            this.drawAtTime(this.currentTime);
          }
        } else if (!this.isAnimating) {
           this.drawAtTime(this.currentTime);
        }
        requestAnimationFrame(() => this.renderLoop());
      }
      
      // Inherit other methods...
      toggleModalFields() {
        const layout = document.getElementById('modalLayout').value;
        const fields = document.getElementById('alignableFields');
        if (fields) fields.style.display = layout === 'intro-alignable' ? 'block' : 'none';
      }
      closeModal() { document.getElementById('editModal').classList.remove('active'); }
      openExport() { document.getElementById('exportModal').classList.add('active'); }
      closeExport() { document.getElementById('exportModal').classList.remove('active'); }
      showToast(msg) {
        const t = document.getElementById('studioToast');
        t.innerText = msg.toUpperCase();
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 2500);
      }
      ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      handleDragStart(e, i) { this.draggedItem = i; e.target.classList.add('dragging'); }
      handleDrop(e, i) {
        e.preventDefault();
        const item = this.slides.splice(this.draggedItem, 1)[0];
        this.slides.splice(i, 0, item);
        this.updateSlideList();
      }
      removeSlide(index) { this.slides.splice(index, 1); this.updateSlideList(); }
      copyProject() {
        const data = JSON.stringify(this.slides.map(s => {
          const {img, ...rest} = s;
          if (s.type === 'image') rest.imgData = img.src;
          return rest;
        }));
        navigator.clipboard.writeText(data);
        this.showToast("JSON COPIED");
      }
      downloadProject() {
        const data = JSON.stringify(this.slides.map(s => {
          const {img, ...rest} = s;
          if (s.type === 'image') rest.imgData = img.src;
          return rest;
        }));
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "project.tas-studio";
        a.click();
        this.showToast("DOWNLOADED .TAS-STUDIO");
      }
      async exportVideo(type) {
        this.closeExport();
        this.showToast(`RECORDING ${type.toUpperCase()}...`);
        const stream = this.canvas.captureStream(60);
        const mimeType = type === 'webm' ? 'video/webm;codecs=vp9' : 'video/mp4';
        try {
          this.recordedChunks = [];
          this.recorder = new MediaRecorder(stream, { mimeType });
          this.recorder.ondataavailable = (e) => { if (e.data.size > 0) this.recordedChunks.push(e.data); };
          this.recorder.onstop = () => {
            const blob = new Blob(this.recordedChunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tas-video.${type}`;
            a.click();
            this.showToast("EXPORT COMPLETE");
          };
          this.currentTime = 0;
          this.isAnimating = true;
          this.recorder.start();
        } catch(e) { this.showToast("FORMAT NOT SUPPORTED"); }
      }
      wrapText(text, maxWidth, baseSize) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = words[0];
        this.ctx.font = `900 ${baseSize}px 'Alfa Slab One'`;
        for (let i = 1; i < words.length; i++) {
          const word = words[i];
          const width = this.ctx.measureText(currentLine + " " + word).width;
          if (width < maxWidth) currentLine += " " + word;
          else { lines.push(currentLine); currentLine = word; }
        }
        lines.push(currentLine);
        return lines;
      }
      drawTextContent(slide, ox, oy) {
        this.ctx.save();
        this.ctx.translate(ox, oy);
        this.ctx.fillStyle = '#1a1a1a';
        if (slide.layout === 'center') {
          let baseSize = 200;
          const maxWidth = this.res.w * 0.8;
          let lines = this.wrapText(slide.mainText, maxWidth, baseSize);
          if (lines.length > 4) { baseSize = 120; lines = this.wrapText(slide.mainText, maxWidth, baseSize); }
          if (lines.length > 8) { baseSize = 80; lines = this.wrapText(slide.mainText, maxWidth, baseSize); }
          this.ctx.font = `900 ${baseSize}px 'Alfa Slab One'`;
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          const totalH = lines.length * baseSize;
          lines.forEach((line, i) => {
            const y = (this.res.h / 2) - (totalH / 2) + (i * baseSize) + baseSize/2;
            this.ctx.fillText(line, this.res.w / 2, y);
          });
        } else {
          const titleSize = 100;
          const descSize = 45;
          const padding = 100;
          const spacing = 30;
          this.ctx.textBaseline = 'top';
          let tx, ty;
          const al = slide.alignment;
          if (al === 'tl') { tx = padding; ty = padding; this.ctx.textAlign = 'left'; }
          if (al === 'tr') { tx = this.res.w - padding; ty = padding; this.ctx.textAlign = 'right'; }
          if (al === 'bl') { tx = padding; ty = this.res.h - padding - titleSize - descSize - spacing; this.ctx.textAlign = 'left'; }
          if (al === 'br') { tx = this.res.w - padding; ty = this.res.h - padding - titleSize - descSize - spacing; this.ctx.textAlign = 'right'; }
          this.ctx.font = `900 ${titleSize}px 'Alfa Slab One'`;
          this.ctx.globalAlpha = 1.0;
          this.ctx.fillText(slide.mainText, tx, ty);
          this.ctx.font = `900 ${descSize}px 'Alfa Slab One'`;
          this.ctx.globalAlpha = 0.5;
          this.ctx.fillText(slide.descText, tx, ty + titleSize + spacing);
        }
        this.ctx.restore();
      }
      drawFrame(slide, ox, oy) {
        this.ctx.fillStyle = '#FFB703';
        this.ctx.fillRect(ox, oy, this.res.w, this.res.h);
        if (slide.type === 'text') this.drawTextContent(slide, ox, oy);
        else this.drawImageContent(slide, ox, oy);
      }
    }
    window.studio = new TASVideoStudio();
  </script>
