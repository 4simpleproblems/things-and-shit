<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Generator | things and s***.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* header */
    .hero { padding: 80px 40px 20px; text-align: center; }
    .hero h1 { 
      font-family: 'Alfa Slab One', serif; 
      font-size: clamp(40px, 9vw, 85px); 
      color: #1a1a1a; 
      line-height: 1.2;
      letter-spacing: -3px;
      display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;
    }
    .title-badge {
      display: inline-block; padding: 5px 20px; background: #ffffff; border: 5px solid #1a1a1a; border-radius: 15px;
      transform: rotate(-4deg); cursor: default; box-shadow: 6px 6px 0px #f0f0f0;
    }
    .hero p { font-weight: 800; color: #ccc; margin-top: 20px; text-transform: uppercase; letter-spacing: 4px; font-size: 12px; }

    /* layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

    /* controls */
    .controls-panel {
      background: #ffffff; border: 5px solid #1a1a1a; border-radius: 30px; padding: 30px;
      box-shadow: 10px 10px 0px #f0f0f0;
    }
    
    .control-group { margin-bottom: 25px; }
    .control-group label { display: block; font-weight: 900; margin-bottom: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    
    textarea {
      width: 100%; border: 4px solid #1a1a1a; border-radius: 15px; padding: 15px;
      font-family: 'Alfa Slab One', serif; font-size: 18px; resize: vertical; outline: none;
      background: #f9f9f9;
    }
    textarea:focus { background: #fff; box-shadow: 4px 4px 0px #e8e8e8; }

    .slider {
      -webkit-appearance: none; width: 100%; height: 10px; border-radius: 5px;
      background: #e8e8e8; outline: none; border: 2px solid #1a1a1a;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 25px; height: 25px; border-radius: 50%;
      background: #FFB703; border: 4px solid #1a1a1a; cursor: pointer;
    }

    .download-btn {
      display: block; width: 100%; margin-top: 30px; padding: 18px;
      background: #FFB703; color: #1a1a1a; border: 5px solid #1a1a1a; border-radius: 20px;
      font-family: 'Alfa Slab One', serif; font-size: 20px; cursor: pointer;
      box-shadow: 6px 6px 0px #1a1a1a; transition: all 0.2s ease;
    }
    .download-btn:hover { transform: translateY(4px); box-shadow: 2px 2px 0px #1a1a1a; background: #ffc436; }

    /* preview */
    .preview-panel {
      background: #f9f9f9; border: 5px solid #1a1a1a; border-radius: 30px;
      display: flex; align-items: center; justify-content: center; padding: 40px;
      box-shadow: 10px 10px 0px #f0f0f0;
      background-image: 
        linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee),
        linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee);
      background-size: 20px 20px; background-position: 0 0, 10px 10px;
    }

    canvas {
      width: 100%; max-width: 512px; height: auto;
      border: 2px dashed #ccc; border-radius: 20px; background: transparent;
    }
  </style>
</head>
<body id="mainBody">
<script src="loader.js"></script>

<div class="main-wrapper">
<div class="hero">
  <h1>favicon <span class="title-badge">maker.</span></h1>
  <p>things-and-shit.org is officially alive</p>
</div>

<div class="container">
  <div class="controls-panel">
    <div class="control-group">
      <label>Lines of Text</label>
      <textarea id="textInput" rows="3">s
***</textarea>
    </div>
    
    <div class="control-group">
      <label>X Position</label>
      <input type="range" id="xPos" class="slider" min="-250" max="250" value="0">
    </div>

    <div class="control-group">
      <label>Y Position</label>
      <input type="range" id="yPos" class="slider" min="-250" max="250" value="0">
    </div>

    <div class="control-group">
      <label>Merge Power (Gooeyness)</label>
      <input type="range" id="gooey" class="slider" min="1" max="40" value="18">
    </div>

    <div class="control-group">
      <label>Line Spacing</label>
      <input type="range" id="lineSpacing" class="slider" min="50" max="150" value="85">
    </div>

    <div class="control-group">
      <label>Border Roundness</label>
      <input type="range" id="roundness" class="slider" min="0" max="100" value="20">
    </div>

    <div class="control-group">
      <label>Border Thickness</label>
      <input type="range" id="border" class="slider" min="0" max="30" value="12">
    </div>

    <div class="control-group">
      <label>Font Size</label>
      <input type="range" id="fontSize" class="slider" min="50" max="300" value="160">
    </div>

    <div class="control-group">
      <label>Rotation (deg)</label>
      <input type="range" id="rotation" class="slider" min="-45" max="45" value="-4">
    </div>

    <div class="control-group">
      <label>Shadow Drop</label>
      <input type="range" id="shadow" class="slider" min="0" max="60" value="25">
    </div>

    <button class="download-btn" onclick="downloadFavicon()">Download PNG</button>
  </div>

  <div class="preview-panel">
    <canvas id="favCanvas" width="512" height="512"></canvas>
  </div>
</div>
</div>

<script>
  const canvas = document.getElementById('favCanvas');
  const ctx = canvas.getContext('2d');
  const size = 512;

  function applySoftThreshold(tCtx) {
    const imgData = tCtx.getImageData(0, 0, size, size);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      let a = data[i+3];
      a = (a - 110) * 8; 
      data[i+3] = Math.max(0, Math.min(255, a));
    }
    tCtx.putImageData(imgData, 0, 0);
  }

  function drawFavicon() {
    const lines = document.getElementById('textInput').value.split('\n');
    const fontSize = parseInt(document.getElementById('fontSize').value);
    const gooey = parseInt(document.getElementById('gooey').value);
    const border = parseInt(document.getElementById('border').value);
    const rot = parseInt(document.getElementById('rotation').value);
    const shadowOffset = parseInt(document.getElementById('shadow').value);
    const spacingRatio = parseInt(document.getElementById('lineSpacing').value) / 100;
    
    const xPos = parseInt(document.getElementById('xPos').value);
    const yPos = parseInt(document.getElementById('yPos').value);
    const roundness = parseInt(document.getElementById('roundness').value);

    ctx.clearRect(0, 0, size, size);

    const paddingX = fontSize * 0.4;
    const paddingY = fontSize * 0.2;
    const lineHeight = fontSize * spacingRatio;

    const totalH = lines.length * lineHeight;
    
    const centerX = (size / 2) + xPos;
    const startY = ((size - totalH) / 2) + (lineHeight / 2) + yPos;

    // layer 1: black blob
    const tmpLayer = document.createElement('canvas');
    tmpLayer.width = size; tmpLayer.height = size;
    const tCtx = tmpLayer.getContext('2d');
    
    tCtx.fillStyle = '#1a1a1a';
    tCtx.filter = `blur(${gooey}px)`;

    lines.forEach((line, i) => {
      tCtx.font = `900 ${fontSize}px 'Alfa Slab One'`;
      const w = tCtx.measureText(line).width;
      const rectW = w + paddingX * 2 + border * 2;
      const rectH = fontSize + paddingY * 2 + border * 2;
      tCtx.beginPath();
      tCtx.roundRect(centerX - rectW/2, startY + i * lineHeight - rectH/2, rectW, rectH, roundness + border);
      tCtx.fill();
    });

    applySoftThreshold(tCtx);

    // layer 2: white blob
    const tmpLayerWhite = document.createElement('canvas');
    tmpLayerWhite.width = size; tmpLayerWhite.height = size;
    const tCtxW = tmpLayerWhite.getContext('2d');
    
    tCtxW.fillStyle = '#ffffff';
    tCtxW.filter = `blur(${gooey}px)`;

    lines.forEach((line, i) => {
      tCtxW.font = `900 ${fontSize}px 'Alfa Slab One'`;
      const w = tCtxW.measureText(line).width;
      const rectW = w + paddingX * 2;
      const rectH = fontSize + paddingY * 2;
      tCtxW.beginPath();
      tCtxW.roundRect(centerX - rectW/2, startY + i * lineHeight - rectH/2, rectW, rectH, roundness);
      tCtxW.fill();
    });

    applySoftThreshold(tCtxW);

    // assemble
    ctx.save();
    
    ctx.translate(centerX, (size / 2) + yPos);
    ctx.rotate(rot * Math.PI / 180);
    ctx.translate(-centerX, -((size / 2) + yPos));

    // shadow
    if (shadowOffset > 0) {
      ctx.shadowOffsetX = shadowOffset;
      ctx.shadowOffsetY = shadowOffset;
      ctx.shadowColor = '#e0e0e0';
      ctx.shadowBlur = 0; 
    }

    ctx.drawImage(tmpLayer, 0, 0);

    ctx.shadowColor = 'transparent';

    ctx.drawImage(tmpLayerWhite, 0, 0);

    // text
    ctx.fillStyle = '#1a1a1a';
    ctx.font = `900 ${fontSize}px 'Alfa Slab One'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    lines.forEach((line, i) => {
      ctx.fillText(line, centerX, startY + i * lineHeight - (fontSize * 0.05));
    });

    ctx.restore();
  }

  function downloadFavicon() {
    const link = document.createElement('a');
    link.download = 'things-and-shit-favicon.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // auto-draw
  document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('input', drawFavicon);
  });

  // draw on font load
  document.fonts.ready.then(drawFavicon);
</script>
<script src="main.js"></script>
</body>
</html>
