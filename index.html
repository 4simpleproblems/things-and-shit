<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>things and s***.</title>
  <meta name="title" content="things and s***.">
  <meta name="description" content="An archive of random objects and adrenaline crashes. Explore the physical receipts of lessons learned through the lens of a brutalist collection.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://things-and-shit.org/">
  <meta property="og:title" content="things and s***.">
  <meta property="og:description" content="An archive of random objects and adrenaline crashes. Explore the physical receipts of lessons learned through the lens of a brutalist collection.">
  <meta property="og:image" content="https://things-and-shit.org/favicon.ico">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://things-and-shit.org/">
  <meta property="twitter:title" content="things and s***.">
  <meta property="twitter:description" content="An archive of random objects and adrenaline crashes. Explore the physical receipts of lessons learned through the lens of a brutalist collection.">
  <meta property="twitter:image" content="https://things-and-shit.org/favicon.ico">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      font-family: 'Nunito', sans-serif; 
      background: #ffffff; 
      color: #1a1a1a; 
      padding-bottom: 100px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- HERO & SORTING --- */
    .hero { padding: 80px 24px 20px; text-align: center; } /* Reduced from 120px */
    .hero h1 { 
      font-family: 'Alfa Slab One', serif; 
      font-size: clamp(40px, 9vw, 85px); 
      color: #1a1a1a; 
      line-height: 1.2;
      letter-spacing: -3px;
      display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
    }

    .title-badge-hitbox { display: inline-block; padding: 10px; cursor: help; }
    .title-badge {
      display: inline-block; padding: 5px 25px; background: #ffffff; border: 5px solid #1a1a1a; border-radius: 20px;
      transform: rotate(-4deg); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 6px 6px 0px #f0f0f0;
    }
    .title-badge-hitbox:hover .title-badge { transform: rotate(0deg) scale(1.1); box-shadow: 12px 12px 0px #f0f0f0; }

    .sort-wrapper { display: flex; justify-content: center; gap: 15px; margin: 40px 0 60px; flex-wrap: wrap; }
    .sort-tag-hitbox { padding: 5px; cursor: pointer; }
    .sort-tag {
      padding: 8px 20px; border: 3px solid #1a1a1a; border-radius: 12px;
      font-family: 'Alfa Slab One', serif; font-size: 12px;
      transition: all 0.3s ease; transform: rotate(-2deg); background: #fff;
    }
    .sort-tag-hitbox:hover .sort-tag { transform: rotate(0deg) scale(1.1); box-shadow: 4px 4px 0px #1a1a1a; }
    .sort-tag.active { background: #1a1a1a; color: #fff; transform: rotate(0deg); }

    /* --- GRID --- */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; flex: 1; width: 100%; }
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 60px 40px; }

    .card { position: relative; cursor: pointer; }
    .slot-design {
      background: #ffffff;
      border: 5px solid #1a1a1a;
      border-radius: 40px;
      overflow: hidden; 
      box-shadow: 10px 10px 0px #f0f0f0;
      transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .card:hover .slot-design { transform: translateY(-20px); box-shadow: 25px 25px 0px #e8e8e8; }

    .slot-visual {
      aspect-ratio: 1/1; background: #f9f9f9; border-bottom: 5px solid #1a1a1a;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .slot-visual img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .slot-content { padding: 30px; }
    .slot-title { font-family: 'Alfa Slab One', serif; font-size: 24px; line-height: 1.1; margin-bottom: 8px; }
    .slot-desc-short { font-size: 14px; color: #666; font-weight: 600; line-height: 1.4; }

    /* --- TAGS --- */
    .tag {
      position: absolute;
      bottom: -15px;
      right: -10px;
      z-index: 20;
      padding: 8px 18px;
      border: 4px solid #1a1a1a;
      border-radius: 18px;
      font-family: 'Alfa Slab One', serif;
      font-size: 14px;
      text-transform: lowercase;
      transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      white-space: nowrap;
      transform: rotate(4deg);
    }
    .card:hover .tag { transform: rotate(0deg) scale(1.2) translateY(-20px); }

    .tag-frustration { background: #FF0054; color: #ffffff; box-shadow: 4px 4px 0px #80002a; } 
    .tag-hype        { background: #FFB703; color: #1a1a1a; box-shadow: 4px 4px 0px #b38600; } 
    .tag-shock       { background: #70D6FF; color: #1a1a1a; box-shadow: 4px 4px 0px #386b80; } 
    .tag-neutral     { background: #ffffff; color: #1a1a1a; box-shadow: 4px 4px 0px #ccc; }

    /* --- FOOTER --- */
    .the-end { text-align: center; color: #ccc; font-weight: 800; font-size: 14px; margin-top: 80px; letter-spacing: 2px; }
    .footer-bar { position: absolute; bottom: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 12px; font-weight: 700; }
    .footer-bar a { color: #aaa; text-decoration: none; transition: color 0.2s ease; }
    .footer-bar a:hover { color: #1a1a1a; }

    /* --- MODAL --- */
    #expansionOverlay { position: fixed; z-index: 10000; display: none; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
    #expansionOverlay.active { top: 40px !important; left: 40px !important; width: calc(100vw - 80px) !important; height: calc(100vh - 80px) !important; }
    #modalDetailsView { z-index: 2; opacity: 0; background: #fff; border-radius: 40px; border: 5px solid #1a1a1a; overflow: hidden; transition: opacity 0.3s ease; }
    #expansionOverlay.active #modalDetailsView { opacity: 1; pointer-events: auto; box-shadow: 25px 25px 0px #1a1a1a; }
    #modalMainContent { display: flex; flex-direction: row; height: 100%; width: 100%; }
    .visual-expanded-container { position: relative; background: #ffffff; flex: 0 0 50%; border-right: 5px solid #1a1a1a; display: flex; align-items: center; justify-content: center; }
    .slide { position: absolute; inset: 30px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s ease; }
    .slide.active { opacity: 1; z-index: 2; }
    .slide img, .texture-slide-inner { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 30px; border: 5px solid #1a1a1a; background: #f9f9f9; box-shadow: 10px 10px 0px #f0f0f0; }
    
    .btn-hitbox {
      position: absolute; width: 60px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
    }
    .slide-btn, .close-x {
      background: #ffffff; color: #1a1a1a; border: 5px solid #1a1a1a; border-radius: 15px; box-shadow: 4px 4px 0px #f0f0f0; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .btn-hitbox:hover .slide-btn, .btn-hitbox:hover .close-x { transform: translateY(-4px); box-shadow: 8px 8px 0px #e8e8e8; }
    .btn-hitbox:hover .close-x { color: #FF0054; }

    .prev-hitbox { left: 10px; top: 50%; transform: translateY(-50%); }
    .next-hitbox { right: 10px; top: 50%; transform: translateY(-50%); }
    .close-hitbox { right: 15px; top: 15px; }

    .modal-expanded-info { padding: 40px; flex: 1; overflow-y: auto; background: #fff; }
    .desc-full { font-size: 18px; color: #1a1a1a; font-weight: 500; line-height: 1.7; margin-top: 10px; }
    #dimmer { position: fixed; inset: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; z-index: 9998; transition: opacity 0.5s ease; }
    #dimmer.visible { opacity: 1; pointer-events: auto; }

    @media (max-width: 800px) {
      .hero { padding: 35px 16px 20px; } /* Shrunk mobile top gap */
      .item-grid { grid-template-columns: 1fr; }
      #expansionOverlay.active { top: 12px !important; left: 12px !important; width: calc(100vw - 24px) !important; height: calc(100vh - 24px) !important; }
      #modalMainContent { flex-direction: column; }
      .visual-expanded-container { flex: 0 0 35%; border-right: none; border-bottom: 4px solid #1a1a1a; }
      .footer-bar { position: static; flex-direction: column; text-align: center; margin-top: 40px; padding-bottom: 20px; }
      .slide { inset: 15px; }
      .tag { bottom: -10px; right: -5px; padding: 6px 14px; font-size: 12px; }
    }
  </style>
</head>
<body id="mainBody">

<div id="dimmer" onclick="closeExpanded()"></div>

<div class="hero">
  <h1>things and 
    <div class="title-badge-hitbox">
      <span class="title-badge">s***.</span>
    </div>
  </h1>
</div>

<div class="container">
  <div class="sort-wrapper">
    <div class="sort-tag-hitbox" onclick="filterGrid('all', this)"><div class="sort-tag active">all</div></div>
    <div class="sort-tag-hitbox" onclick="filterGrid('thing', this)"><div class="sort-tag">things</div></div>
    <div class="sort-tag-hitbox" onclick="filterGrid('s***', this)"><div class="sort-tag">s***</div></div>
  </div>
  
  <div class="item-grid" id="mainGrid"></div>
  <div class="the-end">the end.</div>
</div>

<div class="footer-bar">
  <span>Made with ❤ from 4SP. &copy; 2026</span>
  <a href="mailto:hello@things-and-shit.org">hello@things-and-shit.org</a>
</div>

<div id="expansionOverlay">
  <div id="modalSlotReplica" style="position:absolute; inset:0; z-index:1;"></div>

  <div id="modalDetailsView" style="position:absolute; inset:0; display:flex; flex-direction:column;">
    <div class="btn-hitbox close-hitbox" onclick="closeExpanded()">
      <div class="close-x"><i class="fa-solid fa-xmark"></i></div>
    </div>
    
    <div id="modalMainContent">
      <div class="visual-expanded-container">
        <div id="slideshow" style="width:100%; height:100%; position:relative;">
          <div class="btn-hitbox prev-hitbox" onclick="changeSlide(-1)">
            <div class="slide-btn"><i class="fa-solid fa-chevron-left"></i></div>
          </div>
          <div class="btn-hitbox next-hitbox" onclick="changeSlide(1)">
            <div class="slide-btn"><i class="fa-solid fa-chevron-right"></i></div>
          </div>
        </div>
      </div>
      <div class="modal-expanded-info">
        <div class="slot-title" id="eTitle" style="font-size: 38px;"></div>
        <div id="eDate" style="color: #aaa; font-weight: 900; text-transform: uppercase; font-size: 11px; margin-bottom: 15px; letter-spacing: 2px;"></div>
        <div class="desc-full" id="eText"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const archiveData = [
    {
      id: 1, category: "thing", title: "the nelson rock", date: "march 15th, 2026",
      tag: "Aw s***.", shortDesc: "deceptive pebbles and an adrenaline crash.",
      fullDesc: "I was walking across a massive rock that was packed with embedded pebbles. I honestly thought those pebbles would act like grip tape for my shoes, but they did the exact opposite, it was like stepping on ball bearings. I went down hard. I was wearing a jacket, which luckily kept the open wounds from getting immediate dirt or infection, but it still shredded my arms. The crazy part is it didn't even hurt that much at first. If you look at the photos from the car right after, I'm not even flinching. But the second I stood up and tried to walk away, the adrenaline wore off FAST. Suddenly every scrape and grit-burn hit me all at once. This rock is the physical receipt for that lesson.",
      images: ['images/nelsons_rock/rock-1.jpeg', 'images/nelsons_rock/rock-2.jpeg', 'images/nelsons_rock/rock-3.jpeg', 'images/nelsons_rock/heal-1.jpeg', 'images/nelsons_rock/heal-2.jpeg', 'images/nelsons_rock/heal-3.jpeg']
    },
    {
      id: 2, category: "s***", title: "s*** placeholder", date: "ongoing",
      tag: "F*** yeah!", shortDesc: "for the memories that don't have a shape.",
      fullDesc: "A placeholder for the entries that exist in thought but haven't taken physical form. This slot represents the abstract side of the archive.",
      images: ["texture"]
    },
    {
      id: 3, category: "thing", title: "object placeholder", date: "none",
      tag: "Whoa.", shortDesc: "testing the limits of the layout.",
      fullDesc: "A structural anchor for the collection until a new physical object is added. This serves to demonstrate the grid and tag systems.",
      images: ["https://placehold.co/600x400/fff/1a1a1a?text=Placeholder"]
    }
  ];

  let originCard = null;
  let currentSlideIndex = 0;

  function renderGrid(cat = 'all') {
    const grid = document.getElementById('mainGrid');
    grid.innerHTML = '';
    const filtered = cat === 'all' ? archiveData : archiveData.filter(i => i.category === cat);
    
    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openExpanded(card, item);
      
      const lowTag = item.tag.toLowerCase();
      const tagClass = lowTag.includes('s***') ? 'tag-frustration' : (lowTag.includes('f***') ? 'tag-hype' : (lowTag.includes('whoa') ? 'tag-shock' : 'tag-neutral'));
      const visualHTML = item.images[0] === 'texture' 
        ? '<div class="slot-visual" style="background-image:repeating-linear-gradient(45deg, #ccc, #ccc 1px, transparent 1px, transparent 15px); background-size:20px 20px;"><div class="shit-icon" style="font-family:\'Alfa Slab One\'; color:#ddd; font-size:60px;">s***</div></div>'
        : `<div class="slot-visual"><img src="${item.images[0]}"></div>`;
      
      card.innerHTML = `
        <div class="slot-design">
          ${visualHTML}
          <div class="slot-content">
            <div class="slot-title">${item.title}</div>
            <div class="slot-desc-short">${item.shortDesc}</div>
          </div>
        </div>
        <div class="tag ${tagClass}">${item.tag}</div>
      `;
      grid.appendChild(card);
    });
  }

  function filterGrid(cat, hit) {
    document.querySelectorAll('.sort-tag').forEach(t => t.classList.remove('active'));
    hit.querySelector('.sort-tag').classList.add('active');
    renderGrid(cat);
  }

  function openExpanded(card, item) {
    originCard = card;
    const overlay = document.getElementById('expansionOverlay');
    const ss = document.getElementById('slideshow');
    const rect = card.querySelector('.slot-design').getBoundingClientRect();

    document.getElementById('eTitle').textContent = item.title;
    document.getElementById('eDate').textContent = item.date;
    document.getElementById('eText').textContent = item.fullDesc;

    const navButtons = ss.querySelectorAll('.btn-hitbox:not(.close-hitbox)');
    navButtons.forEach(btn => btn.style.display = item.images.length > 1 ? 'flex' : 'none');

    const replica = document.getElementById('modalSlotReplica');
    replica.innerHTML = '';
    const cloned = card.querySelector('.slot-design').cloneNode(true);
    cloned.style.transform = 'none';
    cloned.style.width = '100%'; cloned.style.height = '100%';
    replica.appendChild(cloned);

    overlay.appendChild(card.querySelector('.tag'));

    currentSlideIndex = 0;
    ss.querySelectorAll('.slide').forEach(s => s.remove());
    item.images.forEach((src, i) => {
      const s = document.createElement('div');
      s.className = `slide ${i === 0 ? 'active' : ''}`;
      s.innerHTML = src === 'texture' ? '<div class="texture-slide-inner" style="background-image:repeating-linear-gradient(45deg, #ccc, #ccc 1px, transparent 1px, transparent 15px); background-size:20px 20px;"><div style="font-family:\'Alfa Slab One\'; color:#bbb; font-size:60px;">s***</div></div>' : `<img src="${src}">`;
      ss.insertBefore(s, ss.firstChild);
    });

    overlay.style.transition = 'none';
    overlay.style.display = 'block';
    overlay.style.top = rect.top + 'px';
    overlay.style.left = rect.left + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    card.style.visibility = 'hidden';

    requestAnimationFrame(() => {
      document.getElementById('dimmer').classList.add('visible');
      overlay.style.transition = 'all 0.5s cubic-bezier(0.19, 1, 0.22, 1)';
      overlay.classList.add('active');
    });
    document.body.style.overflow = 'hidden';
  }

  function closeExpanded() {
    const overlay = document.getElementById('expansionOverlay');
    const rect = originCard.querySelector('.slot-design').getBoundingClientRect();
    document.getElementById('dimmer').classList.remove('visible');
    overlay.classList.remove('active');
    overlay.style.top = rect.top + 'px';
    overlay.style.left = rect.left + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';

    setTimeout(() => {
      overlay.style.display = 'none';
      originCard.style.visibility = 'visible';
      originCard.appendChild(overlay.querySelector('.tag'));
      document.body.style.overflow = 'auto';
    }, 500);
  }

  function changeSlide(n) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length <= 1) return;
    slides[currentSlideIndex].classList.remove('active');
    currentSlideIndex = (currentSlideIndex + n + slides.length) % slides.length;
    slides[currentSlideIndex].classList.add('active');
  }

  renderGrid();
</script>
</body>
</html>
