<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things and s***.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      font-family: 'Nunito', sans-serif; 
      background: #ffffff; 
      color: #1a1a1a; 
      padding-bottom: 100px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* --- HERO & SORTING --- */
    .hero { padding: 120px 24px 20px; text-align: center; }
    .hero h1 { 
      font-family: 'Alfa Slab One', serif; 
      font-size: clamp(40px, 9vw, 85px); 
      color: #1a1a1a; 
      line-height: 1.2;
      letter-spacing: -3px;
      display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
    }

    .title-badge {
      display: inline-block; padding: 5px 25px; background: #ffffff; border: 5px solid #1a1a1a; border-radius: 20px;
      transform: rotate(-4deg); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: help; box-shadow: 6px 6px 0px #f0f0f0;
    }
    .title-badge:hover { transform: rotate(0deg) scale(1.1); box-shadow: 0px 10px 0px #f0f0f0; }

    .sort-wrapper { display: flex; justify-content: center; gap: 15px; margin: 40px 0 60px; }
    .sort-tag {
      padding: 8px 20px; border: 3px solid #1a1a1a; border-radius: 12px;
      font-family: 'Alfa Slab One', serif; font-size: 12px; cursor: pointer;
      transition: all 0.3s ease; transform: rotate(-2deg); background: #fff;
    }
    .sort-tag:hover { transform: rotate(0deg) scale(1.1); box-shadow: 4px 4px 0px #1a1a1a; }
    .sort-tag.active { background: #1a1a1a; color: #fff; transform: rotate(0deg); }

    /* --- GRID --- */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 60px 40px; }

    /* --- CARD ARCHITECTURE --- */
    .card {
      position: relative;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .card:hover { transform: translateY(-20px); }

    .slot-design {
      background: #ffffff;
      border: 5px solid #1a1a1a;
      border-radius: 40px;
      overflow: hidden; /* Masks the image only */
      box-shadow: 10px 10px 0px #f0f0f0;
      transition: box-shadow 0.4s ease;
    }
    .card:hover .slot-design { box-shadow: 0px 30px 0px #e8e8e8; }

    .slot-visual {
      aspect-ratio: 1/1; background: #f9f9f9; border-bottom: 5px solid #1a1a1a;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .slot-visual img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .slot-content { padding: 30px; }
    .slot-title { font-family: 'Alfa Slab One', serif; font-size: 24px; line-height: 1.1; margin-bottom: 8px; text-transform: none; }
    .slot-desc-short { font-size: 14px; color: #666; font-weight: 600; line-height: 1.4; }

    /* --- ENHANCED REACTION TAGS --- */
    .tag {
      position: absolute;
      bottom: -15px;
      right: -10px;
      z-index: 20;
      padding: 8px 18px;
      border: 4px solid #1a1a1a;
      border-radius: 18px;
      font-family: 'Alfa Slab One', serif;
      font-size: 14px;
      text-transform: lowercase;
      transform: rotate(4deg);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }
    .card:hover .tag { transform: rotate(0deg) scale(1.2); bottom: -20px; right: -15px; }

    /* Performance Colors */
    .tag-frustration { background: #FF0054; color: #ffffff; box-shadow: 4px 4px 0px #80002a; } 
    .tag-hype        { background: #FFB703; color: #1a1a1a; box-shadow: 4px 4px 0px #b38600; } 
    .tag-shock       { background: #70D6FF; color: #1a1a1a; box-shadow: 4px 4px 0px #386b80; } 
    .tag-epic        { background: #FFBE0B; color: #1a1a1a; box-shadow: 4px 4px 0px #805f06; }
    .tag-neutral     { background: #ffffff; color: #1a1a1a; box-shadow: 4px 4px 0px #ccc; }

    /* --- FOOTER ELEMENTS --- */
    .the-end {
      text-align: center;
      color: #ccc;
      font-weight: 800;
      font-size: 14px;
      margin-top: 80px;
      letter-spacing: 2px;
    }

    .footer-copy {
      position: absolute;
      bottom: 24px;
      left: 24px;
      color: #aaa;
      font-size: 12px;
      font-weight: 700;
    }

    /* --- MODAL SYSTEM --- */
    body.animating .tag, body.animating .card { transition: none !important; pointer-events: none !important; }

    #expansionOverlay {
      position: fixed; z-index: 10000; display: none; pointer-events: auto;
      transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }
    #expansionOverlay.active {
      top: 40px !important; left: 40px !important;
      width: calc(100vw - 80px) !important; height: calc(100vh - 80px) !important;
    }

    #modalSlotReplica, #modalDetailsView { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #modalSlotReplica { z-index: 1; opacity: 1; transition: opacity 0.3s ease; }
    #expansionOverlay.active #modalSlotReplica { opacity: 0; }

    #modalDetailsView { 
      z-index: 2; opacity: 0; pointer-events: none; background: #fff; 
      border-radius: 40px; border: 5px solid #1a1a1a; overflow: hidden; transition: opacity 0.3s ease; 
    }
    #expansionOverlay.active #modalDetailsView { opacity: 1; pointer-events: auto; box-shadow: 25px 25px 0px #1a1a1a; }

    #modalMainContent { display: flex; flex-direction: column; height: 100%; width: 100%; }
    .visual-expanded-container {
      position: relative; background: #ffffff; flex: 0 0 55%;
      display: flex; align-items: center; justify-content: center;
    }
    
    .slide {
      position: absolute; 
      inset: 30px; 
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.4s ease;
      z-index: 1;
    }
    .slide.active { opacity: 1; z-index: 2; }

    .slide img, .texture-slide-inner { 
      width: 100%; height: 100%; 
      object-fit: cover;
      border-radius: 30px;
      border: 5px solid #1a1a1a;
      background: #f9f9f9;
      box-shadow: 10px 10px 0px #f0f0f0;
    }

    .slide-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: #ffffff; color: #1a1a1a;
      border: 5px solid #1a1a1a; border-radius: 20px;
      box-shadow: 6px 6px 0px #f0f0f0;
      padding: 10px 20px; font-family: 'Alfa Slab One', serif; font-size: 18px;
      cursor: pointer; z-index: 10; 
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .slide-btn:hover { background: #f9f9f9; transform: translateY(calc(-50% - 5px)); box-shadow: 0px 12px 0px #e8e8e8; }
    .slide-btn.prev { left: 10px; }
    .slide-btn.next { right: 10px; }

    .close-x { 
      position: absolute; top: 15px; right: 15px; 
      background: #ffffff; color: #1a1a1a; 
      border: 5px solid #1a1a1a; border-radius: 20px;
      box-shadow: 6px 6px 0px #f0f0f0;
      width: 50px; height: 50px; 
      font-family: 'Alfa Slab One', serif; font-size: 20px; 
      cursor: pointer; z-index: 100;
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .close-x:hover { transform: translateY(-5px); box-shadow: 0px 12px 0px #e8e8e8; color: #FF0054; }

    .modal-expanded-info { padding: 10px 40px 40px 40px; flex: 1; overflow-y: auto; background: #fff; position: relative; }
    .desc-full { font-size: 18px; color: #1a1a1a; font-weight: 500; line-height: 1.7; margin-top: 10px; }
    
    #dimmer { position: fixed; inset: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; z-index: 9998; transition: opacity 0.5s ease; }
    #dimmer.visible { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body id="mainBody">

<div id="dimmer" onclick="closeExpanded()"></div>

<div class="hero">
  <h1>things and <span class="title-badge">s***.</span></h1>
</div>

<div class="container">
  <div class="sort-wrapper">
    <div class="sort-tag active" onclick="filterGrid('all', this)">all</div>
    <div class="sort-tag" onclick="filterGrid('thing', this)">things</div>
    <div class="sort-tag" onclick="filterGrid('s***', this)">s***</div>
  </div>
  
  <div class="item-grid" id="mainGrid"></div>
  
  <div class="the-end">the end.</div>
</div>

<div class="footer-copy">Made with ❤ from 4SP. &copy; 2026</div>

<div id="expansionOverlay">
  <div id="modalSlotReplica"></div>

  <div id="modalDetailsView">
    <button class="close-x" onclick="closeExpanded()">✕</button>
    <div id="modalMainContent">
      <div class="visual-expanded-container" id="visualContainer">
        <div id="slideshow" style="width:100%; height:100%; position:relative;">
          <button class="slide-btn prev" onclick="changeSlide(-1)">&lt;</button>
          <button class="slide-btn next" onclick="changeSlide(1)">&gt;</button>
        </div>
      </div>
      <div class="modal-expanded-info">
        <div class="slot-title" id="eTitle" style="font-size: 38px;"></div>
        <div id="eDate" style="color: #aaa; font-weight: 900; text-transform: uppercase; font-size: 11px; margin-bottom: 15px; letter-spacing: 2px;"></div>
        <div class="desc-full" id="eText"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const archiveData = [
    {
      id: 1, category: "thing", title: "the nelson rock", date: "march 15th, 2026",
      tag: "Aw s***.", shortDesc: "deceptive pebbles and an adrenaline crash.",
      fullDesc: "I was walking across a massive rock that was packed with embedded pebbles. I honestly thought those pebbles would act like grip tape for my shoes, but they did the exact opposite, it was like stepping on ball bearings. I went down hard. I was wearing a jacket, which luckily kept the open wounds from getting immediate dirt or infection, but it still shredded my arms. The crazy part is it didn't even hurt that much at first. If you look at the photos from the car right after, I'm not even flinching. But the second I stood up and tried to walk away, the adrenaline wore off FAST. Suddenly every scrape and grit-burn hit me all at once. This rock is the physical receipt for that lesson.",
      images: [
        'images/nelsons_rock/rock-1.jpeg', 
        'images/nelsons_rock/rock-2.jpeg', 
        'images/nelsons_rock/rock-3.jpeg',
        'images/nelsons_rock/heal-1.jpeg', 
        'images/nelsons_rock/heal-2.jpeg', 
        'images/nelsons_rock/heal-3.jpeg'
      ]
    },
    {
      id: 2, category: "s***", title: "the s***.", date: "ongoing",
      tag: "F*** yeah!", shortDesc: "for the memories that don't have a shape.",
      fullDesc: "This block holds the parts of the collection that don't have a physical representation. These are placeholders for the stories, contexts, and abstract nonsense that makes up the rest of the archive.",
      images: ["texture"]
    },
    {
        id: 3, category: "thing", title: "melted pick", date: "july 2025",
        tag: "Whoa.", shortDesc: "4 hours on a dashboard in July.",
        fullDesc: "Left this pick on the dash during a heatwave. It warped into a perfect 'S' curve. Completely unplayable but it's the best looking piece of plastic I own now.",
        images: ["https://placehold.co/600x400/fff/1a1a1a?text=Melted+Pick+01"]
    }
  ];

  let originCard = null;
  let currentSlideIndex = 0;

  function getTagClass(tagText) {
    if (!tagText) return '';
    const t = tagText.toLowerCase();
    if (t.includes('s***')) return 'tag-frustration';
    if (t.includes('yeah')) return 'tag-hype';
    if (t.includes('whoa')) return 'tag-shock';
    return 'tag-neutral';
  }

  function renderGrid(cat = 'all') {
    const grid = document.getElementById('mainGrid');
    grid.innerHTML = '';
    const filtered = cat === 'all' ? archiveData : archiveData.filter(i => i.category === cat);
    
    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = `card`;
      card.onclick = () => openExpanded(card, item);
      
      const visualHTML = item.images[0] === 'texture' 
        ? '<div class="slot-visual" style="background-image:repeating-linear-gradient(45deg, #ccc, #ccc 1px, transparent 1px, transparent 15px); background-size:20px 20px;"><div class="shit-icon" style="font-family:\'Alfa Slab One\'; color:#ddd; font-size:60px;">s***</div></div>'
        : `<div class="slot-visual"><img src="${item.images[0]}" alt="${item.title}"></div>`;
      
      card.innerHTML = `
        <div class="slot-design">
          ${visualHTML}
          <div class="slot-content">
            <div class="slot-title">${item.title}</div>
            <div class="slot-desc-short">${item.shortDesc}</div>
          </div>
        </div>
        ${item.tag ? `<div class="tag ${getTagClass(item.tag)}">${item.tag}</div>` : ''}
      `;
      grid.appendChild(card);
    });
  }

  function filterGrid(cat, btn) {
    document.querySelectorAll('.sort-tag').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(cat);
  }

  function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    if(slides.length === 0) return;
    slides.forEach(s => s.classList.remove('active'));
    
    if (index >= slides.length) currentSlideIndex = 0;
    else if (index < 0) currentSlideIndex = slides.length - 1;
    else currentSlideIndex = index;

    slides[currentSlideIndex].classList.add('active');
  }

  function changeSlide(direction) {
    showSlide(currentSlideIndex + direction);
  }

  function openExpanded(card, item) {
    originCard = card;
    const body = document.getElementById('mainBody');
    const overlay = document.getElementById('expansionOverlay');
    const dimmer = document.getElementById('dimmer');
    const ss = document.getElementById('slideshow');
    
    const slotBox = card.querySelector('.slot-design');
    const rect = slotBox.getBoundingClientRect();

    // 1. Text Content
    document.getElementById('eTitle').textContent = item.title;
    document.getElementById('eDate').textContent = item.date;
    document.getElementById('eText').textContent = item.fullDesc;

    // 2. Clone Box for Hero Animation
    const replica = document.getElementById('modalSlotReplica');
    replica.innerHTML = '';
    const clonedBox = slotBox.cloneNode(true);
    clonedBox.style.width = '100%';
    clonedBox.style.height = '100%';
    clonedBox.style.margin = '0';
    replica.appendChild(clonedBox);

    // 3. Move Tag into Overlay
    const realTag = card.querySelector('.tag');
    if (realTag) {
      overlay.appendChild(realTag);
    }

    // 4. Initialize Slideshow
    currentSlideIndex = 0;
    ss.querySelectorAll('.slide').forEach(s => s.remove());
    const btns = ss.querySelectorAll('.slide-btn');

    if (item.images[0] === 'texture') {
        btns.forEach(b => b.style.display = 'none');
        const textureSlide = document.createElement('div');
        textureSlide.className = 'slide active';
        textureSlide.innerHTML = '<div class="texture-slide-inner" style="background-image:repeating-linear-gradient(45deg, #ccc, #ccc 1px, transparent 1px, transparent 15px); background-size:20px 20px;"><div class="shit-icon" style="color: #bbb; font-family:\'Alfa Slab One\'; font-size:60px;">s***</div></div>';
        ss.insertBefore(textureSlide, ss.firstChild);
    } else {
        btns.forEach(b => b.style.display = item.images.length > 1 ? 'block' : 'none');
        item.images.forEach((src, i) => {
            const s = document.createElement('div');
            s.className = `slide ${i === 0 ? 'active' : ''}`;
            s.innerHTML = `<img src="${src}" alt="${item.title} slide ${i+1}" onerror="this.src='https://placehold.co/600x400/ccc/777?text=Image+Not+Found'">`;
            ss.insertBefore(s, ss.firstChild);
        });
    }

    // Teleport & Animate
    body.classList.add('animating');
    overlay.style.transition = 'none';
    overlay.style.display = 'block';
    overlay.style.top = rect.top + 'px';
    overlay.style.left = rect.left + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    
    slotBox.style.visibility = 'hidden'; 

    requestAnimationFrame(() => {
      dimmer.classList.add('visible');
      overlay.style.transition = 'all 0.5s cubic-bezier(0.19, 1, 0.22, 1)';
      overlay.classList.add('active');
    });

    setTimeout(() => body.classList.remove('animating'), 500);
    document.body.style.overflow = 'hidden';
  }

  function closeExpanded() {
    const body = document.getElementById('mainBody');
    const overlay = document.getElementById('expansionOverlay');
    const dimmer = document.getElementById('dimmer');
    const slotBox = originCard.querySelector('.slot-design');
    const rect = slotBox.getBoundingClientRect();

    body.classList.add('animating');
    dimmer.classList.remove('visible');
    overlay.classList.remove('active'); 
    overlay.style.top = rect.top + 'px';
    overlay.style.left = rect.left + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';

    setTimeout(() => {
      overlay.style.display = 'none';
      slotBox.style.visibility = 'visible';
      
      const realTag = overlay.querySelector('.tag');
      if (realTag) {
        originCard.appendChild(realTag);
      }

      body.classList.remove('animating');
      document.body.style.overflow = 'auto';
    }, 500);
  }

  renderGrid();
</script>
</body>
</html>
