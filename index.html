<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things and s***.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      font-family: 'Nunito', sans-serif; 
      background: #ffffff; 
      color: #1a1a1a; 
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    /* --- HERO --- */
    .hero {
      padding: 120px 24px 80px;
      text-align: center;
    }

    .hero h1 { 
      font-family: 'Alfa Slab One', serif; 
      font-size: clamp(40px, 9vw, 85px); 
      color: #1a1a1a; 
      line-height: 1.2;
      letter-spacing: -3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .title-badge {
      display: inline-block;
      padding: 5px 25px;
      background: #ffffff;
      border: 5px solid #1a1a1a;
      border-radius: 20px;
      transform: rotate(-4deg);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: help;
      box-shadow: 6px 6px 0px #f0f0f0;
    }

    .title-badge:hover { 
      transform: rotate(0deg) scale(1.1); 
      box-shadow: 0px 10px 0px #f0f0f0; 
    }

    .hero p {
      font-weight: 800; color: #ccc; margin-top: 30px; text-transform: uppercase; letter-spacing: 4px; font-size: 12px;
    }

    /* --- GRID --- */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }

    /* --- SLOT DESIGN --- */
    .slot-design { background: #ffffff; border: 5px solid #1a1a1a; border-radius: 40px; overflow: hidden; }
    .slot-visual { aspect-ratio: 1/1; background: #f9f9f9; border-bottom: 5px solid #1a1a1a; display: flex; align-items: center; justify-content: center; position: relative; }
    .slot-visual img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .slot-content { padding: 30px; }
    .slot-title { font-family: 'Alfa Slab One', serif; font-size: 24px; line-height: 1.1; margin-bottom: 8px; text-transform: none; }
    .slot-desc-short { font-size: 14px; color: #666; font-weight: 600; line-height: 1.4; }

    .card { box-shadow: 10px 10px 0px #f0f0f0; transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1); cursor: pointer; }
    .card:hover { transform: translateY(-20px); box-shadow: 0px 30px 0px #e8e8e8; }

    .card.shit-block .slot-visual {
      outline: 5px solid #1a1a1a; outline-offset: -5px; 
      background-image: repeating-linear-gradient(45deg, #ccc, #ccc 1px, transparent 1px, transparent 15px);
      background-size: 20px 20px;
    }
    .shit-icon { font-family: 'Alfa Slab One', serif; color: #ddd; font-size: 60px; user-select: none; }

    /* --- MODAL SYSTEM --- */
    #expansionOverlay {
      position: fixed; z-index: 10000; background: #fff;
      display: none; pointer-events: auto;
      transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    #expansionOverlay.active {
      top: 40px !important; left: 40px !important;
      width: calc(100vw - 80px) !important; height: calc(100vh - 80px) !important;
      box-shadow: 25px 25px 0px #1a1a1a;
    }

    #modalSlotReplica, #modalDetailsView { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
    #modalSlotReplica { z-index: 1; transition: opacity 0.3s ease; }
    #expansionOverlay.active #modalSlotReplica { opacity: 0; }

    #modalDetailsView { z-index: 2; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #expansionOverlay.active #modalDetailsView { opacity: 1; pointer-events: auto; }

    #modalMainContent { display: flex; flex-direction: column; height: 100%; width: 100%; }

    /* Image area */
    .visual-expanded-container {
      position: relative; background: #000;
      flex: 0 0 45%; 
      border-bottom: 6px solid #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    #slideshow, #modalTextureVisual { width: 100%; height: 100%; display: none; }
    .show-slideshow #slideshow { display: block; }
    .show-texture #modalTextureVisual { display: flex; }

    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s ease; display: flex; align-items: center; justify-content: center; }
    .slide.active { opacity: 1; }
    .slide img { max-height: 90%; max-width: 90%; object-fit: contain; }

    /* Portrait Mode Override */
    #expansionOverlay.portrait-mode #modalMainContent { flex-direction: row; }
    #expansionOverlay.portrait-mode .visual-expanded-container {
      flex: 0 0 40%; height: 100%; border-bottom: none; border-right: 6px solid #1a1a1a;
    }

    /* Text Area */
    .modal-expanded-info { padding: 40px; flex: 1; overflow-y: auto; background: #fff; }
    .desc-full { font-size: 18px; color: #1a1a1a; font-weight: 500; line-height: 1.7; margin-top: 10px; }

    /* UI UI Elements */
    .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: #fff; border: 4px solid #1a1a1a; padding: 12px; cursor: pointer; font-family: 'Alfa Slab One', serif; z-index: 10; border-radius: 12px; }
    .prev { left: 20px; } .next { right: 20px; }
    .close-x { position: absolute; top: 20px; right: 20px; background: #1a1a1a; color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; font-family: 'Alfa Slab One', serif; cursor: pointer; z-index: 100; }
    .textured-detail { background-color: #f9f9f9; background-image: repeating-linear-gradient(45deg, #ddd, #ddd 1px, transparent 1px, transparent 20px); align-items: center; justify-content: center; width: 100%; height: 100%; }

    #dimmer { position: fixed; inset: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; z-index: 9998; transition: opacity 0.5s ease; }
    #dimmer.visible { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

<div id="dimmer" onclick="closeExpanded()"></div>

<div class="hero">
  <h1>things and <span class="title-badge">s***.</span></h1>
  <p>random objects / real stories / archived</p>
</div>

<div class="container">
  <div class="item-grid" id="mainGrid"></div>
</div>

<div id="expansionOverlay" class="slot-design">
  <div id="modalSlotReplica">
    <div class="slot-visual" id="replicaVisual"></div>
    <div class="slot-content">
      <div class="slot-title" id="replicaTitle"></div>
      <div class="slot-desc-short" id="replicaDescShort"></div>
    </div>
  </div>

  <div id="modalDetailsView">
    <button class="close-x" onclick="closeExpanded()">✕</button>
    <div id="modalMainContent">
      <div class="visual-expanded-container" id="visualContainer">
        <div id="slideshow" class="slideshow">
          <button class="slide-btn prev" onclick="changeSlide(-1)">❮</button>
          <button class="slide-btn next" onclick="changeSlide(1)">❯</button>
        </div>
        <div id="modalTextureVisual" class="textured-detail">
           <div class="shit-icon" style="color: #bbb;">s***</div>
        </div>
      </div>
      <div class="modal-expanded-info">
        <div class="slot-title" id="eTitle" style="font-size: 38px;"></div>
        <div id="eDate" style="color: #aaa; font-weight: 900; text-transform: uppercase; font-size: 11px; margin-bottom: 15px; letter-spacing: 2px;"></div>
        <div class="desc-full" id="eText"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // JSON DATA WITH UPDATED PATHS
  const archiveData = [
    {
      id: 1, 
      type: "standard", 
      title: "the nelson rock", 
      date: "march 15th, 2026",
      shortDesc: "deceptive pebbles and a fast-fading adrenaline rush.",
      fullDesc: "I was walking across a massive rock that was packed with embedded pebbles. I honestly thought those pebbles would act like grip tape for my shoes, but they did the exact opposite—it was like stepping on ball bearings. I went down hard. I was wearing a jacket, which luckily kept the open wounds from getting immediate dirt or infection, but it still shredded my arms. The crazy part is it didn't even hurt that much at first. If you look at the photos from the car right after, I'm not even flinching. But the second I stood up and tried to walk away, the adrenaline wore off FAST. Suddenly every scrape and grit-burn hit me all at once. This rock is the physical receipt for that lesson.",
      images: [
        'images/nelsons_rock/rock-1.jpeg', 
        'images/nelsons_rock/rock-2.jpeg', 
        'images/nelsons_rock/rock-3.jpeg',
        'images/nelsons_rock/heal-1.jpeg', 
        'images/nelsons_rock/heal-2.jpeg', 
        'images/nelsons_rock/heal-3.jpeg'
      ]
    },
    {
      id: 2, 
      type: "shit-block", 
      title: "the s***.", 
      date: "ongoing",
      shortDesc: "for the memories that don't have a shape.",
      fullDesc: "This block holds the parts of the collection that don't have a physical representation. Sometimes the most important things you find aren't something you can pick up. These are placeholders for the stories, contexts, and abstract nonsense that makes up the rest of the archive.",
      images: ["texture"]
    }
  ];

  let currentSlide = 0;
  let originCard = null;
  let currentImages = [];

  function renderGrid() {
    const grid = document.getElementById('mainGrid');
    archiveData.forEach(item => {
      const card = document.createElement('div');
      card.className = `card slot-design ${item.type === 'shit-block' ? 'shit-block' : ''}`;
      card.onclick = () => openExpanded(card, item);
      const visualHTML = item.type === 'shit-block' 
        ? '<div class="slot-visual"><div class="shit-icon">s***</div></div>'
        : `<div class="slot-visual"><img src="${item.images[0]}" alt="${item.title}"></div>`;
      card.innerHTML = `${visualHTML}<div class="slot-content"><div class="slot-title">${item.title}</div><div class="slot-desc-short">${item.shortDesc}</div></div>`;
      grid.appendChild(card);
    });
  }

  function setOrientation(imgSrc) {
    const overlay = document.getElementById('expansionOverlay');
    overlay.classList.remove('portrait-mode');
    if (imgSrc === "texture") return;
    const img = new Image();
    img.onload = function() {
      if (img.height > img.width) overlay.classList.add('portrait-mode');
    };
    img.src = imgSrc;
  }

  function openExpanded(card, item) {
    originCard = card;
    currentImages = item.images;
    const overlay = document.getElementById('expansionOverlay');
    const dimmer = document.getElementById('dimmer');
    const visual = document.getElementById('visualContainer');
    const rect = card.getBoundingClientRect();

    setOrientation(item.images[0]);
    visual.classList.remove('show-slideshow', 'show-texture');
    
    document.getElementById('replicaTitle').textContent = item.title;
    document.getElementById('replicaDescShort').textContent = item.shortDesc;
    const replicaVisual = document.getElementById('replicaVisual');
    replicaVisual.innerHTML = '';

    if (item.type === 'shit-block') {
      replicaVisual.innerHTML = '<div class="shit-icon">s***</div>';
      replicaVisual.className = 'slot-visual textured-detail';
      visual.classList.add('show-texture');
    } else {
      replicaVisual.innerHTML = `<img src="${item.images[0]}" style="width:100%;height:100%;object-fit:cover;">`;
      replicaVisual.className = 'slot-visual';
      visual.classList.add('show-slideshow');
      const ss = document.getElementById('slideshow');
      ss.querySelectorAll('.slide').forEach(s => s.remove());
      item.images.forEach((src, i) => {
        const s = document.createElement('div');
        s.className = `slide ${i === 0 ? 'active' : ''}`;
        s.innerHTML = `<img src="${src}" onerror="this.src='https://via.placeholder.com/600?text=Object'">`;
        ss.appendChild(s);
      });
      currentSlide = 0;
    }

    document.getElementById('eTitle').textContent = item.title;
    document.getElementById('eDate').textContent = item.date;
    document.getElementById('eText').textContent = item.fullDesc;

    overlay.style.transition = 'none';
    overlay.style.display = 'flex';
    overlay.style.top = rect.top + 'px';
    overlay.style.left = rect.left + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    originCard.style.visibility = 'hidden'; 

    requestAnimationFrame(() => {
      dimmer.classList.add('visible');
      overlay.style.transition = 'all 0.5s cubic-bezier(0.19, 1, 0.22, 1)';
      overlay.classList.add('active');
    });
    document.body.style.overflow = 'hidden';
  }

  function closeExpanded() {
    const overlay = document.getElementById('expansionOverlay');
    const dimmer = document.getElementById('dimmer');
    const rect = originCard.getBoundingClientRect();
    dimmer.classList.remove('visible');
    overlay.classList.remove('active'); 
    overlay.style.top = rect.top + 'px';
    overlay.style.left = rect.left + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    setTimeout(() => {
      overlay.style.display = 'none';
      originCard.style.visibility = 'visible';
      document.body.style.overflow = 'auto';
    }, 500);
  }

  function changeSlide(n) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length < 2) return;
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + n + slides.length) % slides.length;
    slides[currentSlide].classList.add('active');
    setOrientation(currentImages[currentSlide]);
  }

  renderGrid();
</script>
</body>
</html>
